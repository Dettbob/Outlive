/* ---------- AI: day ---------- */
function aiPickAction(p,h,acts){
  const cand=acts.filter(a=>a.v>0.3||a.kind==='unlock');
  if(!cand.length)return null;
  cand.sort((a,b)=>(b.v/Math.max(1,b.kind==='scav'&&b.id==='sN'?b.ap:1))-(a.v/Math.max(1,a.kind==='scav'&&a.id==='sN'?a.ap:1)));
  // prefer bulk scavenging when it is the best per-AP option
  const best=cand[0];
  if(best.kind==='scav'){const bulk=cand.find(a=>a.kind==='scav'&&a.id==='sN');if(bulk)return bulk}
  return best;
}
function locValue(p,h,L,str,here){
  const k=LOCS[L].k,res=LOC_RES[L],loc=G.loc[L];let v=0;
  if(k==='cargo'){
    const o=cargoOptions(p,h);if(!o.length)return -5;
    const best=o.map(x=>CARGO_SPOTS[x.i].canned*resValue(p,'canned')+2.2).sort((a,b)=>b-a)[0];
    v=best+(G.cargoClaimed?0:.7)+(canUse(p,'depot')?1.4:0)+(canUse(p,'dock')?2.8:0)+(eqReady(p,'hacksaw')?2:0);
    return v;
  }
  if(k==='base'){
    const n=Math.min(str,loc.amt);
    v=n*resValue(p,'mun')+(G.algae&&p.rad<3?1.3:0)+(eqReady(p,'crowbar')?2.2:0);
    if(eqReady(p,'ammobox')&&n>0)v+=Math.min(2,loc.amt-n)*resValue(p,'mun');
    return v;
  }
  if(k==='dam'){
    if(!eqReady(p,'card')&&p.res.chip<1)return 0;
    const n=Math.min(str,loc.amt);
    return n*resValue(p,'water')-(eqReady(p,'card')?0:resValue(p,'chip'))+(eqReady(p,'jerrycan')&&n>0?Math.min(1,loc.amt-n):0);
  }
  if(k==='wild'){
    const n=Math.min(str,loc.amt);let sc=n*resValue(p,res);
    const bon={forest:'axe',mine:'pickaxe',fair:'backpack'}[L];
    if(bon&&eqReady(p,bon)&&n>0)sc+=Math.min(2,loc.amt-n)*resValue(p,res);
    let hv=0;
    if(loc.game.length){
      const t=loc.game[0],end=t.end+(G.fx.mut?1:0),y=Math.max(0,t.end-2+(p.caught[t.end]||0)-(G.fx.epi?1:0))+(canUse(p,'lodge')?2:0)+(canUse(p,'snares')?1:0);
      const m=Math.min(p.res.mun,Math.min(end,2)),need=Math.max(1,end-m);
      if(need<=str){hv=y*resValue(p,'meat')-m*.5+(str-need)*resValue(p,res)*.8}
    }
    v=Math.max(sc,hv);
    const vis={forest:['bow','meat',1],mine:['purifier','water',1],fair:['detector','canned',1]}[L];
    if(vis&&eqReady(p,vis[0]))v+=resValue(p,vis[1]);
    return v;
  }
  if(k==='city'){
    const n=Math.min(str,loc.search.length+loc.equip.length);
    v=n*.8+(eqReady(p,'chainsaw')?2:0)+(eqReady(p,'flashlight')?2.2:0)+(hasRoom(p,'scouts')&&!p.cityBonus['s'+L]?1.5:0);
    return v;
  }
  return 0;
}
function aiChooseMove(p){
  let best=null;
  for(let hi=0;hi<p.heroes.length;hi++){
    const h=p.heroes[hi];if(h.state!=='idle')continue;
    for(const d of destinations(p,h)){
      const str=effStr(p,h);let v=locValue(p,h,d.loc,str,[]);
      for(const q of G.players){
        if(q===p)continue;
        for(const x of q.heroes)if(x.loc===d.loc&&x.state==='act'&&x.str<h.str){
          const pts=h.str-x.str,avail=RES_ALL.filter(r=>r!=='mun').reduce((a,r)=>a+q.res[r],0);
          v+=Math.min(pts,avail)*(q.res.mun>=pts?.35:.9);
        }
      }
      if(d.exo)v-=.4;
      v+=rand()*.35;
      if(!best||v>best.v)best={hi,loc:d.loc,v};
    }
  }
  return best;
}

/* ---------- night ---------- */
function applyEventDiscount(p,cost){
  const opts=[];
  const sup=SUPS.filter(r=>cost[r]>0);
  if(sup.length){const c={...cost};const r=sup.sort((a,b)=>(c[b]-p.res[b])-(c[a]-p.res[a]))[0];c[r]--;opts.push(c)}
  const mm=[...MATS,'mun'];
  if(mm.some(r=>cost[r]>0)){const c={...cost};for(let k=0;k<2;k++){const rs=mm.filter(r=>c[r]>0).sort((a,b)=>(c[b]-p.res[b])-(c[a]-p.res[a]));if(!rs.length)break;c[rs[0]]--}opts.push(c)}
  if(!opts.length)return null;
  opts.sort((a,b)=>(short(p,a)-short(p,b))||(sumObj(a)-sumObj(b)));
  return opts[0];
}
function eventCost(p,id){
  const base=EVENTS[id].cost;
  if(canUse(p,'command')){const d=applyEventDiscount(p,base);if(d)return{cost:d,disc:true}}
  return{cost:{...base},disc:false};
}
function supplyNeeds(p,extraRooms){
  const rows=airRows(p.air);
  const rooms=p.rooms.filter(r=>r.built&&r.pop>0).reduce((a,r)=>a+ROOMS[r.k].up,0);
  return{rows,rooms};
}
async function nightPhase(){
  G.phase='night';
  for(const p of G.players)for(const h of p.heroes){h.state='idle';h.spot=null}
  log(`— Day ${G.day} · Night falls.`,'phase');render();
  await fx('banner',`Night ${G.day}`,'Overcome events · feed · radiation · recruit · build · repair','night');
  // 1 events
  let passes=0,i=0,guard=0;
  const ord=order();
  while(G.active.length&&passes<G.n&&guard++<80){
    const p=ord[i%G.n];i++;
    const ch=await decideEvent(p);
    if(ch){
      const{cost,disc}=eventCost(p,ch);
      if(disc)useRoom(p,'command');
      for(const r in cost)p.res[r]-=cost[r];
      p.events.push(ch);G.active.splice(G.active.indexOf(ch),1);pop(P_(p),`+${EVENTS[ch].sp} SP`,'good');await fx('turn',p,'night');await sleep(700);
      log(`${pname(p)} Overcomes ${EVENTS[ch].n} (+${EVENTS[ch].sp} SP) for ${costStr(cost)}.`,'good');
      passes=0;render();
    }else passes++;
  }
  // 2 feed, 3 radiation
  for(const p of ord){await fx('focus',p);await feedStep(p);await sleep(500)}
  for(const p of ord){await fx('focus',p);await radStep(p);await sleep(500)}
  render();
  // 4-6
  for(const p of ord){
    if(p.human){await handoff(p);await U().nightReport(p);await U().shelter(p)}
    else await aiNight(p);
    await fx('turnEnd',p,'night');
  }
  // 7 upkeep
  for(const p of ord){p.res.meat=0;p.res.water=Math.min(p.res.water,2)}
  render();
}
async function decideEvent(p){
  const aff=G.active.filter(id=>canPay(p,eventCost(p,id).cost));
  if(!aff.length)return null;
  if(p.human){
    const opts=aff.map(id=>{const c=eventCost(p,id);return{id,label:`${EVENTS[id].n}  (+${EVENTS[id].sp} SP)`,sub:`Cost ${costStr(c.cost)}${c.disc?' (Command Post discount)':''} — ${EVENTS[id].t}`}});
    opts.push({id:'pass',label:'Pass',sub:'Let the next Tribe decide.'});
    await handoff(p);
    const r=await U().chooseOne(`${p.name}: Overcome an Event?`,opts,'Overcome Events to stop their effects and score their Survival Points.');
    return r==='pass'?null:r;
  }
  let best=null;
  for(const id of aff){
    const c=eventCost(p,id).cost;
    const after={...p.res};for(const r in c)after[r]-=c[r];
    const need=supplyNeeds(p);
    const supAfter=SUPS.reduce((a,r)=>a+after[r],0);
    if(supAfter<need.rows+need.rooms||after.water<need.rows)continue;
    const toks=sumObj(c);
    const harm=['cloud','clan','cold','rats','sandstorm','wildfire','cavein','thieves','lean'].includes(id)?1.2:.5;
    const ratio=(EVENTS[id].sp+harm*Math.max(0,6-G.day))/Math.max(1,toks);
    if(ratio>=.95&&(!best||ratio>best.r))best={id,r:ratio};
  }
  return best?best.id:null;
}
async function feedStep(p){
  const rows=airRows(p.air);
  let needRows=rows,perm=hasRoom(p,'cistern')?activeRooms(p,'cistern').length:0;
  const fp=Math.min(perm,needRows);needRows-=fp;perm-=fp;
  const wu=Math.min(needRows,p.res.water);p.res.water-=wu;needRows-=wu;
  let need=p.rooms.filter(r=>r.built&&r.pop>0).reduce((a,r)=>a+ROOMS[r.k].up,0);
  const pu=Math.min(perm,need);need-=pu;
  while(need>0){
    if(p.res.meat>0)p.res.meat--;
    else if(p.res.water>2)p.res.water--;
    else if(p.res.canned>0)p.res.canned--;
    else if(p.res.water>0)p.res.water--;
    else break;
    need--;
  }
  const shortN=needRows+need;
  p.report.push(`Fed ${survivors(p)} Survivors (Airlock rows: ${rows}💧, Rooms upkeep).`);
  pop(P_(p),`fed ${survivors(p)}👤`,'feed');
  if(shortN>0){log(`${pname(p)} is short ${shortN} Supply — Survivors starve.`,'bad');await loseSurvivors(p,shortN,'starvation')}
}
async function radStep(p){
  const L=RAD_DAY[G.day-1];
  if(canUse(p,'scrubber')){useRoom(p,'scrubber');lowerRad(p,1);log(`${pname(p)}'s Scrubber lowers radiation by 1.`);pop(P_(p),'☢ −1','good')}
  const absorb=p.air+(hasRoom(p,'sealdoor')?1:0);
  const leak=Math.max(0,L-absorb);
  p.report.push(`Radiation ${L}: absorbed ${Math.min(L,absorb)}, leaked ${leak}. Gauge now ${p.rad-leak}.`);
  if(leak){log(`${pname(p)} takes ${leak} radiation.`,'bad');pop(P_(p),`☢ +${leak}`,'rad');await addRad(p,leak,'night')}
}

/* ----- night shelter operations (used by humans through the UI and by AI) ----- */
function recruitMax(p){return Math.max(0,Math.min(nSup(p),AIR_MAX-p.air))}
function paySupplies(p,n){
  for(let i=0;i<n;i++){
    if(p.res.meat>0)p.res.meat--;else if(p.res.water>2)p.res.water--;else if(p.res.canned>0)p.res.canned--;else p.res.water--;
  }
}
function recruit(p,n){n=Math.min(n,recruitMax(p));if(n<=0)return 0;paySupplies(p,n);p.air+=n;log(`${pname(p)} recruits ${n} Survivor${n>1?'s':''}.`);pop(P_(p),`+${n}👤`,'surv');return n}
function moveToRoom(p,ri,n){
  const r=p.rooms[ri];if(!r.built)return 0;
  n=Math.min(n,p.air,ROOMS[r.k].cap-r.pop);if(n<=0)return 0;
  p.air-=n;r.pop+=n;return n;
}
function autoPay(p,allowed,n){
  const pay={};let left=n;
  while(left>0){
    const r=allowed.slice().sort((a,b)=>(p.res[b]-(pay[b]||0))-(p.res[a]-(pay[a]||0)))[0];
    if(p.res[r]-(pay[r]||0)<=0)break;
    pay[r]=(pay[r]||0)+1;left--;
  }
  return pay;
}
async function payMaterials(p,n,allowed){
  allowed=allowed||MATS;
  if(n<=0)return{};
  const have=tot(p,allowed);if(have<n)return null;
  const types=allowed.filter(r=>p.res[r]>0);
  let pay;
  if(p.human&&types.length>1&&have>n)pay=await U().payDialog({title:'Choose what to pay',allowed:types,n,p});
  else pay=autoPay(p,allowed,n);
  for(const r in pay)p.res[r]-=pay[r];
  return pay;
}
function buildCost(p){return canUse(p,'foundry')?1:3}
async function buildRoom(p,ri){
  const r=p.rooms[ri];if(r.built)return false;
  const c=buildCost(p);if(nMat(p)<c)return false;
  const pay=await payMaterials(p,c);if(!pay)return false;
  if(c===1)useRoom(p,'foundry');
  r.built=true;log(`${pname(p)} builds ${ROOMS[r.k].n}.`,'good');pop(P_(p),`built ${ROOMS[r.k].n}`,'build');return true;
}
function repairQuote(p,eq){
  const cost={...EQ[eq.id].cost};const used=[];
  const reduce=k=>{
    for(let i=0;i<k;i++){
      const rs=Object.keys(cost).filter(r=>cost[r]>0).sort((a,b)=>(cost[b]-p.res[b])-(cost[a]-p.res[a]));
      if(!rs.length)return;cost[rs[0]]--;
    }
  };
  let left=sumObj(cost);
  const rooms=[['mechanic',99],['rebuild',2],['workshop',1]];
  const taken={};
  for(const[k,amt]of rooms){
    if(sumObj(cost)<=0)break;
    const n=activeRooms(p,k).filter(r=>!r.used).length-(taken[k]||0);
    if(n>0){taken[k]=(taken[k]||0)+1;used.push(k);if(amt===99)Object.keys(cost).forEach(r=>cost[r]=0);else reduce(amt)}
  }
  return{cost,used};
}
function repairEq(p,ei){
  const eq=p.equip[ei];if(!eq||eq.fixed)return false;
  const q=repairQuote(p,eq);
  if(!canPay(p,q.cost))return false;
  q.used.forEach(k=>useRoom(p,k));
  for(const r in q.cost)p.res[r]-=q.cost[r];
  eq.fixed=true;log(`${pname(p)} repairs ${EQ[eq.id].n}.`,'good');pop(P_(p),`repaired ${EQ[eq.id].n}`,'build');return true;
}
const NIGHT_ABILITY=['armory','cache','lab','scrapper','barracks'];
async function useAbility(p,ri){
  const r=p.rooms[ri];if(!r||!isFull(r)||r.used||!NIGHT_ABILITY.includes(r.k))return false;
  switch(r.k){
    case'armory':p.res.mun+=4;log(`${pname(p)} takes 4${RI.mun} from the Armory.`);break;
    case'cache':drawEquipFor(p);break;
    case'lab':drawEquipFor(p);drawEquipFor(p);break;
    case'barracks':if(r.pop>=8)return false;r.pop++;log(`${pname(p)}'s Barracks takes in a Survivor.`);break;
    case'scrapper':{
      if(!p.equip.length)return false;
      let id;
      if(p.human)id=await U().chooseOne('Destroy which Equipment?',p.equip.map((e,i)=>({id:String(i),label:`${EQ[e.id].n} (${e.fixed?'repaired':'broken'})`,sub:`Returns ${costStr(EQ[e.id].cost)}`})));
      else return false;
      const e=p.equip.splice(+id,1)[0];for(const m in EQ[e.id].cost)p.res[m]+=EQ[e.id].cost[m];log(`${pname(p)} scraps ${EQ[e.id].n}.`);break}
  }
  r.used=true;return true;
}

/* ---------- AI: night ---------- */
function nextRad(){return RAD_DAY[Math.min(5,G.day)]}
async function aiNight(p){
  const last=G.day>=6;
  await fx('turn',p,'night');await sleep(500);
  // abilities that give stuff
  for(let i=0;i<p.rooms.length;i++){
    const k=p.rooms[i].k;
    if(!isFull(p.rooms[i])||p.rooms[i].used)continue;
    if(k==='armory'||k==='barracks')await useAbility(p,i);
    if((k==='cache'||k==='lab')&&p.equip.filter(e=>!e.fixed).length<3&&G.day<=5)await useAbility(p,i);
  }
  // recruit
  const need=supplyNeeds(p);
  let budget=nSup(p);
  if(!last){
    const keep=Math.ceil(.25*(need.rows+need.rooms+2));
    budget=Math.max(0,Math.min(recruitMax(p),(p.res.meat+Math.max(0,p.res.water-2))+Math.max(0,p.res.canned-keep)));
  }else budget=recruitMax(p);
  recruit(p,budget);await sleep(650);
  const doPop=()=>aiPopulate(p,last);
  const pv=survivors(p);doPop();render();await sleep(450);
  // build / repair loop
  for(let g=0;g<6;g++){
    let did=false;
    const unbuilt=p.rooms.map((r,i)=>({r,i})).filter(x=>!x.r.built).sort((a,b)=>ROOMS[b.r.k].pri-ROOMS[a.r.k].pri);
    const builtCount=p.rooms.filter(r=>r.built).length;
    const bc=buildCost(p);
    if(unbuilt.length&&nMat(p)>=bc){
      const x=unbuilt[0];
      const cap=ROOMS[x.r.k].cap;
      const canFill=p.air>=cap-(last?0:1)||(!last&&G.day<=3);
      const sensible=builtCount<=Math.ceil(survivors(p)/3)+1;
      if(canFill&&sensible&&(!last||p.air>=cap)){if(await buildRoom(p,x.i)){did=true;doPop();render();await sleep(650)}}
    }
    if(!did){
      const broken=p.equip.map((e,i)=>({e,i})).filter(x=>!x.e.fixed).filter(x=>canPay(p,repairQuote(p,x.e).cost));
      if(broken.length){if(repairEq(p,broken[0].i)){did=true;render();await sleep(650)}}
    }
    if(!did)break;
  }
  // leftover: more recruits if possible on last night
  if(last){recruit(p,recruitMax(p));aiPopulate(p,true)}
}
function aiPopulate(p,last){
  const L=last?0:nextRad();
  const sealed=hasRoom(p,'sealdoor')?1:0;
  const nightsLeft=Math.max(0,6-G.day);
  let guard=0;
  while(p.air>0&&guard++<40){
    const cand=p.rooms.map((r,i)=>({r,i,rem:ROOMS[r.k].cap-r.pop})).filter(x=>x.r.built&&x.rem>0).sort((a,b)=>a.rem-b.rem||ROOMS[b.r.k].pri-ROOMS[a.r.k].pri);
    if(!cand.length)break;
    const x=cand[0];
    const keep=last?0:Math.max(0,L-sealed);
    const free=Math.max(0,p.air-keep);
    if(x.rem<=p.air){
      const leakNow=Math.max(0,L-sealed-p.air),leakAfter=Math.max(0,L-sealed-(p.air-x.rem));
      const cost=(leakAfter-leakNow)*nightsLeft;
      const fullCount=p.rooms.filter(isFull).length;
      const gain=ROOM_SCORE[Math.min(7,fullCount+1)]-ROOM_SCORE[fullCount]+1.2;
      if(gain>=cost){moveToRoom(p,x.i,x.rem);continue}
    }
    if(free>0){moveToRoom(p,x.i,Math.min(free,x.rem));continue}
    break;
  }
}

/* ---------- scoring ---------- */
function scoreOf(p){
  const ev=p.events.reduce((a,e)=>a+EVENTS[e].sp,0);
  const full=p.rooms.filter(isFull).length;
  const fixed=p.equip.filter(e=>e.fixed);
  const sides={};fixed.forEach(e=>{const s=EQ[e.id];(sides[s.sym]=sides[s.sym]||new Set()).add(s.side)});
  const pairs=Object.values(sides).filter(s=>s.size===2).length;
  const out={events:ev,rooms:ROOM_SCORE[full],fullRooms:full,rad:p.rad,survivors:survivors(p),equip:fixed.length,pairs};
  out.total=out.events+out.rooms+out.rad+out.survivors+out.equip+out.pairs;
  return out;
}
function finalResult(){
  const rows=G.players.map(p=>({p,s:scoreOf(p),sup:nSup(p),oth:nMat(p)+p.res.mun}));
  rows.sort((a,b)=>b.s.total-a.s.total||b.sup-a.sup||b.oth-a.oth);
  G.result=rows;return rows;
}

/* ---------- main loop ---------- */
async function runGame(cfg){
  makeGame(cfg);
  await setupGame();
  for(G.day=1;G.day<=6;G.day++){
    dawn();render();
    await fx('banner',`Day ${G.day}`,'Dawn — the wastelands are replenished','dawn');
    await dayPhase();
    await nightPhase();
  }
  G.day=6;G.phase='over';G.over=true;
  const r=finalResult();
  render();
  const u=U();if(u&&u.final)await u.final(r);
  return r;
}

</script>
<script>
/* =====================================================================
   OUTLIVE — digital prototype: user interface (v0.2)
   ===================================================================== */
(function(){
const VERSION='v0.5.0';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const V={view:0,pm:null,pa:null,pl:null,night:null,recN:0,busy:false,logs:[],modalOpen:false,
  speed:2.2,anim:true,follow:true,gen:0,paused:false,resume:[],turn:null,cap:'',curHero:null,
  flash:{},shake:{},live:false,cfg:null,tut:false,coached:{},prev:{},pops:{},pctx:'pause'};
try{const s=JSON.parse(localStorage.getItem('outlive.settings')||'null');if(s){if(typeof s.speed==='number')V.speed=s.speed;if(typeof s.anim==='boolean')V.anim=s.anim;if(typeof s.follow==='boolean')V.follow=s.follow}}catch(e){}
const saveSet=()=>{try{localStorage.setItem('outlive.settings',JSON.stringify({speed:V.speed,anim:V.anim,follow:V.follow}))}catch(e){}};
const sfx=n=>{try{Sound.sfx(n)}catch(e){}};
const NEVER=new Promise(()=>{});

/* ---------- custom artwork: stays on this device (IndexedDB), never uploaded ---------- */
const ART={map:null,mapRatio:null,leaders:{},names:{}};
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('outlive-art',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function kvGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function kvSet(k,v){try{const d=await idb();await new Promise(r=>{const t=d.transaction('kv','readwrite');v==null?t.objectStore('kv').delete(k):t.objectStore('kv').put(v,k);t.oncomplete=()=>r();t.onerror=()=>r()})}catch(e){}}
function pickFile(){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>res(i.files&&i.files[0]||null);i.oncancel=()=>res(null);i.click()})}
async function shrink(file,max){
  const bm=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bm.width,bm.height));
  const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
  c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  return {blob:await new Promise(r=>c.toBlob(r,'image/jpeg',.88)),w:c.width,h:c.height};
}
async function loadArt(){
  const m=await kvGet('map');
  if(m&&m.blob){ART.map=URL.createObjectURL(m.blob);ART.mapRatio=m.w/m.h}
  for(const l of LEADERS){
    const b=await kvGet('leader:'+l.id);if(b)ART.leaders[l.id]=URL.createObjectURL(b);
    const n=await kvGet('name:'+l.id);if(n){ART.names[l.id]=n;l.n=n}
  }
}
async function setMap(file){
  const r=await shrink(file,1800);await kvSet('map',{blob:r.blob,w:r.w,h:r.h});
  if(ART.map)URL.revokeObjectURL(ART.map);ART.map=URL.createObjectURL(r.blob);ART.mapRatio=r.w/r.h;
}
async function clearMap(){await kvSet('map',null);if(ART.map)URL.revokeObjectURL(ART.map);ART.map=null;ART.mapRatio=null}
async function setLeaderImg(id,file){
  const r=await shrink(file,360);await kvSet('leader:'+id,r.blob);
  if(ART.leaders[id])URL.revokeObjectURL(ART.leaders[id]);ART.leaders[id]=URL.createObjectURL(r.blob);
}
async function clearLeaderImg(id){await kvSet('leader:'+id,null);if(ART.leaders[id])URL.revokeObjectURL(ART.leaders[id]);delete ART.leaders[id]}
const portrait=(id,cls)=>ART.leaders[id]?`<img class="${cls||'por'}" src="${ART.leaders[id]}" alt="">`:'';

/* ---------- timing (pause + abort aware) ---------- */
function wait(ms){
  const g=V.gen;
  return new Promise(res=>{
    setTimeout(async()=>{
      while(V.paused&&g===V.gen)await new Promise(r=>V.resume.push(r));
      if(g!==V.gen)return;           // game was abandoned: the old game never continues
      res();
    },Math.max(0,ms));
  });
}
const scale=()=>V.speed/2.2;

/* ---------- modal system ---------- */
function openModal(build,opts){
  opts=opts||{};
  return new Promise(resolve=>{
    const root=$('#modal');
    root.innerHTML='';
    const box=document.createElement('div');box.className='mbox'+(opts.wide?' wide':'')+(opts.huge?' huge':'');
    root.appendChild(box);root.classList.add('on');V.modalOpen=true;sfx('open');
    const done=v=>{root.classList.remove('on');root.innerHTML='';V.modalOpen=false;renderTurn();resolve(v)};
    V._closeModal=()=>{root.classList.remove('on');root.innerHTML='';V.modalOpen=false};
    build(box,done);
    box.scrollTop=0;renderTurn();
  });
}
function btn(label,cls,fn,sub){
  const b=document.createElement('button');b.className='btn '+(cls||'');
  b.innerHTML=`<span class="bl">${ic(label)}</span>`+(sub?`<span class="bs">${ic(sub)}</span>`:'');
  b.onclick=fn;return b;
}
function head(box,title,text){
  const h=document.createElement('h2');h.innerHTML=ic(title);box.appendChild(h);
  if(text){const p=document.createElement('p');p.className='mtext';p.innerHTML=ic(text);box.appendChild(p)}
}
function infoModal(title,html){return openModal((box,done)=>{head(box,title);const d=document.createElement('div');d.className='mtext';d.innerHTML=ic(html);box.appendChild(d);box.appendChild(btn('Close','pri',()=>done()))})}

function coach(key,title,html){

const T=s=>ic(tr(s));                       // engine text -> translated + emoji replaced by drawn icons
const TE=s=>ic(esc(tr(s)));

const facePic=(id)=>ART.leaders[id]?`<img class="por" src="${ART.leaders[id]}" alt="">`:faceSvg(id);
function leaderCard(l){
  return `<div class="lcard"><div class="lp">${facePic(l.id)}<span class="age" title="Age">${l.age}</span></div><div class="ln">${esc(l.n)}</div>

function heroTok(p,hi){
  const h=p.heroes[hi];
  const cls=['hero',h.state==='act'?'act':'idle'];
  if(V.pm&&V.pm.p===p&&h.state==='idle'&&V.pm.opts.some(o=>o.hi===hi))cls.push('pick');
  if(V.pm&&V.pm.p===p&&V.pm.sel===hi)cls.push('sel');
  if(h.state==='act'&&V.pa&&V.pa.h===h)cls.push('turn');
  if(V.curHero===h)cls.push('turn');
  return `<button class="${cls.join(' ')}" style="--c:${p.color.hex}" data-a="hero" data-p="${p.id}" data-hi="${hi}" title="${esc(p.name)} · Strength ${h.str} · ${h.state==='act'?'activated':'idle'}">${h.str}</button>`;
}

/* ---------- rendering ---------- */
function renderHud(){
  if(!G||!$('#hud'))return;
  const d=Math.max(1,Math.min(6,G.day||1));
  const dots=[1,2,3,4,5,6].map(i=>`<span class="dtk ${i===d?'cur':i<d?'past':''}">${i}</span>`).join('');
  const first=G.players[G.first];
  const phase=G.phase==='setup'?'Setup':G.phase==='over'?'Game over':({dawn:'Dawn',day:'Day',night:'Night'}[G.phase]||'');
  const n=G.active.length;
  $('#hud').innerHTML=`<div class="brand">OUTLIVE<small style="display:inline;margin-left:6px">${VERSION}</small></div><div class="daytrack" title="Day">${dots}</div><span class="pill ${G.phase}">${phase}</span>
    <span class="tonight" title="Radiation added to every Shelter tonight">${icon('rad')} tonight +${RAD_DAY[d-1]}</span>
    <button class="hudbtn ${V.ev?'on':''}" data-a="evtoggle">${icon('event')}<span class="lbl">Events</span>${n?`<span class="badge">${n}</span>`:''}<span>${V.ev?'▴':'▾'}</span></button>
    ${first?`<div class="first" title="First Player token"><span class="dot" style="background:${first.color.hex}"></span>${esc(first.name)} first</div>`:''}`;
  renderEvPanel();
}
function renderEvPanel(){
  const el=$('#evgrid');if(!el||!G)return;
  let h='';
  for(let d=1;d<=6;d++){
    const id=G.events[d-1];
    const rev=d<=G.day&&id&&(d<G.day||G.phase!=='dawn');
    if(!rev){h+=`<div class="evcard future"><div class="dn"><span>DAY ${d}</span><span class="rd">${icon('rad')}${RAD_DAY[d-1]}</span></div><h4>?</h4></div>`;continue}
    const e=EVENTS[id],active=G.active.includes(id),win=G.players.find(p=>p.events.includes(id));
    h+=`<div class="evcard ${active?'active':'won'}" data-a="infoev" data-id="${id}"><div class="dn"><span>DAY ${d}</span><span class="rd">${icon('rad')}${RAD_DAY[d-1]}</span></div><h4>${esc(e.n)}</h4><p>${esc(e.t)}</p>
      <div class="ft"><span>${costHtml(e.cost)}</span><b>+${e.sp} SP</b></div>
      <span class="st">${active?'Active':win?`✓ Overcome · <i class="dot" style="background:${win.color.hex};margin:0"></i>${esc(win.name)}`:'—'}</span></div>`;
  }
  el.innerHTML=h;
  $('#evpanel').classList.toggle('open',!!V.ev);
}
function renderTurn(){
  const el=$('#turnbar');if(!el)return;
  if(!G||!G.players.length){el.innerHTML='';return}
  let cur=null,mode='idle',sub='';
  if(V.pm){cur=V.pm.p;mode='you';sub=V.pm.sel==null?'Tap one of your glowing Heroes, then a highlighted Location.':'Now tap a highlighted Location to move there.'}
  else if(V.pa){cur=V.pa.p;mode='you';sub=`Hero (Strength ${V.pa.h.str}) at ${LOCS[V.pa.h.loc].n} · ${V.pa.h.ap} AP left — choose an action.`}
  else if(V.pl){cur=V.pl.p;mode='you';sub=V.pl.prompt}
  else if(V.night){cur=V.night.p;mode='you';sub='Manage your Shelter: recruit, fill Rooms, build, repair — then press End turn.'}
  else if(V.turn){cur=V.turn.p;mode=cur.human?(V.modalOpen?'you':'wait'):'ai';if(mode==='you')sub='Make your choice.'}
  const phase=G.phase==='over'?'Game over':({dawn:'Dawn',day:'Day phase',night:'Night phase'}[G.phase]||'Setup');
  const chips=G.players.map(p=>{
    const idle=p.heroes.filter(h=>h.state==='idle').length;
    return `<span class="pc ${p===cur?'cur':''}" style="--c:${p.color.hex}"><i class="dot" style="background:${p.color.hex}"></i>${esc(p.name)}${p.human?'':' <em>AI</em>'}${G.phase==='day'?` <small>${idle}/4</small>`:''}</span>`;
  }).join('');
  let who,end='';
  if(mode==='you'){
    who=`<div class="who"><b class="y">▶ ${G.humans===1?'YOUR TURN':esc(cur.name).toUpperCase()+"'S TURN"}</b><span class="cap">${TE(sub)}</span></div>`;
    if(V.pa)end=`<button class="endturn" data-a="endturn">End Hero's turn</button>`;
    else if(V.night)end=`<button class="endturn" data-a="endturn">End turn</button>`;
    else if(V.pm)end=`<button class="endturn" disabled>Move a Hero first</button>`;
  }else if(mode==='ai'){
    who=`<div class="who"><b><span class="spin"></span>${esc(cur.name)} (AI) is playing…</b><span class="cap">${TE(V.cap||'')}</span></div>`;
  }else{
    who=`<div class="who"><b>${phase}</b><span class="cap">${TE(V.cap||'')}</span></div>`;
  }
  el.className=mode==='you'?'you':mode==='ai'?'ai':'';
  el.style.setProperty('--c',cur?cur.color.hex:'#555');
  el.innerHTML=`${who}<div class="order">${chips}</div>${end}`;
  $('#app').classList.toggle('aiplay',mode==='ai');
}
function nodeHtml(k){
  const L=LOCS[k],loc=G.loc[k],res=LOC_RES[k];
  const cls=['node',L.k];
  let dest=null;
  if(V.pm&&V.pm.sel!=null){dest=V.pm.opts.find(o=>o.hi===V.pm.sel).dests.find(d=>d.loc===k);if(dest)cls.push('dest');else cls.push('dim')}
  if(V.pl){if(V.pl.locs.includes(k))cls.push('dest');else cls.push('dim')}
  if(V.pa&&V.pa.h.loc===k)cls.push('here');
  if(V.curHero&&V.curHero.loc===k)cls.push('here');
  const now=Date.now();
  if(V.flash[k]>now)cls.push('flash');
  if(V.shake[k]>now&&V.anim)cls.push('shake');
  let body='';
  if(res)body+=`<div class="pool">${icon(res)}<b>${loc.amt}</b>${L.k==='dam'?`<small>needs 1</small>${icon('chip','sm')}`:''}</div>`;
  if(loc.game){
    const t=loc.game[0];
    body+=`<div class="game" title="Wild Game stack: only the top tile can be hunted">${icon('deer')}<b>${loc.game.length}</b>${t?`<span>next:</span> <b>End ${t.end+(G.fx.mut?1:0)}</b>`:'<span>· empty</span>'}</div>`;
  }
  if(L.k==='city'){
    body+=`<div class="srch">${icon('search')}<b>${loc.search.length}</b> <span>tiles</span></div><div class="eqs">${loc.equip.map(t=>eqCard(t,'',{cls:'mini'})).join('')}</div>`;
  }
  if(L.k==='cargo'){
    body+=`<div class="spots">`+CARGO_SPOTS.slice().reverse().map((s,ri)=>{
      const i=CARGO_SPOTS.length-1-ri;
      const occ=G.players.flatMap(q=>q.heroes.filter(h=>h.loc==='cargo'&&h.state==='act'&&h.spot===i).map(()=>q.color.hex));
      return `<div class="spot ${i===3?'hook':''}" title="${i===3?'Needs Grappling Hook':'Strength '+s.s}"><b>${s.s}</b>→${s.canned}${icon('canned')}${icon('surv')}${occ.map(c=>`<i style="background:${c}"></i>`).join('')}</div>`;
    }).join('')+`</div>`;
  }
  if(L.k==='base')body+=`<div class="game">${icon('algae')}<span>Algae</span> ${G.algae?'<b>ready</b>':'<span>taken</span>'}</div>`;
  const heroes=G.players.flatMap(p=>p.heroes.map((h,hi)=>h.loc===k?heroTok(p,hi):'')).join('');
  return `<div class="${cls.join(' ')}" data-a="loc" data-loc="${k}" style="left:${L.x}%;top:${L.y}%"><div class="nh">${esc(L.n)}</div>${body}<div class="hrow">${heroes}</div>${dest&&dest.exo?'<div class="exo">Exoskeleton</div>':''}</div>`;
}
function drawBg(){
  const b=$('#stage'),svg=$('#bsvg');if(!b||!svg)return;
  const W=b.clientWidth,H=b.clientHeight;if(!W||!H)return;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let s='';
  if(V.pm&&V.pm.sel!=null){
    const o=V.pm.opts.find(o=>o.hi===V.pm.sel),h=V.pm.p.heroes[V.pm.sel];
    const C=k=>({x:LOCS[k].x*W/100,y:LOCS[k].y*H/100});
    if(o&&h)o.dests.forEach(d=>{
      const pts=[C(h.loc)];
      if(!ADJ[h.loc].includes(d.loc)&&!d.exo){const m=ADJ[h.loc].find(m=>ADJ[m].includes(d.loc));if(m)pts.push(C(m))}
      pts.push(C(d.loc));
      s+=`<path class="route" d="M${pts.map(p=>p.x.toFixed(0)+' '+p.y.toFixed(0)).join('L')}"/>`;
      const a=pts[pts.length-2],z=pts[pts.length-1],ang=Math.atan2(z.y-a.y,z.x-a.x),back=Math.min(W*.085,Math.hypot(z.x-a.x,z.y-a.y)*.5),px=z.x-Math.cos(ang)*back,py=z.y-Math.sin(ang)*back,hl=W*.016;
      const nx=-Math.sin(ang)*hl*.6,ny=Math.cos(ang)*hl*.6;
      s+=`<path class="routehead" d="M${(px+Math.cos(ang)*hl).toFixed(0)} ${(py+Math.sin(ang)*hl).toFixed(0)}L${(px+nx).toFixed(0)} ${(py+ny).toFixed(0)}L${(px-nx).toFixed(0)} ${(py-ny).toFixed(0)}z"/>`;
    });
  }
  svg.innerHTML=s;
}
function renderBoard(){
  if(!G||!G.loc.forest)return;
  const st=$('#stage');
  const url=`url(${ART.map||MAP_URL})`;if(st.dataset.bg!==url){st.style.backgroundImage=url;$('#board').style.setProperty('--bgmap',url);st.dataset.bg=url}
  $('#nodes').innerHTML=Object.keys(LOCS).map(nodeHtml).join('');
  const bd=$('#board');if(!bd.dataset.ctr&&bd.scrollWidth>bd.clientWidth){bd.scrollLeft=(bd.scrollWidth-bd.clientWidth)/2;bd.dataset.ctr=1}
  drawBg();
}
if(window.ResizeObserver)new ResizeObserver(()=>{if(G&&G.loc&&G.loc.forest)drawBg()}).observe(document.getElementById('stage'));

/* ----- the bunker (player board) ----- */
const slotIc=(i,on,p)=>`<span class="slot ${on?'':'empty'}" style="--c:${p.color.hex}">${svIcon(i)}</span>`;
function radCol(p){
  let h=`<div class="rh" title="Radioactivity: ${p.rad} (scores ${p.rad>=0?'+':''}${p.rad} SP)">${icon('rad')}</div>`;
  for(let v=3;v>=-11;v--)h+=`<i class="g ${v>0?'pos':v===0?'zero':'neg'} ${v<=-6?'deep':''} ${p.rad===v?'on':''}">${p.rad===v?icon('rad'):v}</i>`;
  return `<div class="radcol">${h}</div>`;
}
function airRoom(p,night){
  const f1=Math.min(p.air,AIR_SIZES[0]),f2=Math.max(0,p.air-AIR_SIZES[0]);
  const row=(n,filled,idx)=>{
    let s='';for(let j=0;j<n;j++)s+=slotIc(j,j<filled,p);
    const used=idx===0?p.air>0:p.air>AIR_SIZES[0];
    return `<div class="arow ${idx===1&&p.air<AIR_SIZES[0]?'lock':''}"><span class="slots">${s}</span><span class="cst" title="Water per night while occupied">${used?'<b>':''}1${icon('water')}${used?'</b>':''}</span></div>`;
  };
  const absorb=p.air+(hasRoom(p,'sealdoor')?1:0);
  let h=`<div class="rm air"><div class="rh"><b>Airlock</b><span class="up">${T(`absorbs ${absorb} ☢ per night`)}</span></div><div class="arows">${row(AIR_SIZES[0],f1,0)}${row(AIR_SIZES[1],f2,1)}</div>`;
  if(night){
    const mx=recruitMax(p);if(V.recN>mx)V.recN=mx;
    h+=`<div class="recruit"><b>Recruit</b> <span class="muted">${T(`Supplies ${nSup(p)} · Airlock free ${AIR_MAX-p.air}`)}</span><div class="stepper"><button data-a="recdn">−</button><span>${V.recN}</span><button data-a="recup">+</button><button class="mini go" data-a="recruit" ${V.recN?'':'disabled'}>Recruit ${V.recN||''}</button><button class="mini" data-a="recmax">Max</button></div></div>`;
  }
  return h+`</div>`;
}
function roomCard(p,i,night){
  const r=p.rooms[i],d=ROOMS[r.k];
  const full=isFull(r);
  const up=d.up?`<span class="up" title="Supplies per night while occupied">${d.up}${icon('food')}</span>`:'<span class="up"></span>';
  if(!r.built){
    const empty=Array.from({length:d.cap},(_,j)=>slotIc(j,false,p)).join('');
    return `<div class="rm unbuilt"><div class="rh"><b>${esc(d.n)}</b>${up}</div><div class="rw">${esc(d.w)}</div><div class="slots">${empty}</div><div class="rt">${esc(d.t)}</div>
      ${night?`<div class="ctl"><button class="mini go" data-a="build" data-i="${i}" ${nMat(p)>=buildCost(p)?'':'disabled'}>Build · ${buildCost(p)} Material${buildCost(p)>1?'s':''}</button></div>`:''}<span class="bgear">${icon('gear')}</span></div>`;
  }
  const slots=Array.from({length:Math.max(d.cap,r.pop)},(_,j)=>slotIc(j,j<r.pop,p)).join('');
  let ctl='';
  if(night){
    if(p.air>0&&r.pop<d.cap)ctl+=`<button class="mini" data-a="move" data-i="${i}" data-n="1">+1 from Airlock</button><button class="mini" data-a="move" data-i="${i}" data-n="9">Fill</button>`;
    if(full&&!r.used&&NIGHT_ABILITY.includes(r.k)&&!(r.k==='barracks'&&r.pop>=8))ctl+=`<button class="mini go" data-a="ability" data-i="${i}">Use ability</button>`;
  }
  return `<div class="rm ${full?'active':'built'} ${r.used?'used':''}"><i class="lamp"></i><div class="rh"><b>${esc(d.n)}</b>${up}</div>
    <div class="rw">${esc(d.w)}${r.used?' · used':''}</div><div class="slots">${slots}</div>
    <div class="rt">${esc(d.t)}</div>${ctl?`<div class="ctl">${ctl}</div>`:''}</div>`;
}

function equipTray(p,night){
  const bySym={};p.equip.forEach((e,i)=>{(bySym[EQ[e.id].sym]=bySym[EQ[e.id].sym]||[]).push({e,i})});
  const one=x=>{
    const q=repairQuote(p,x.e),st=!x.e.fixed?'broken':x.e.used?'used':'ready';
    return `<div class="eqcol">${eqCard(x.e.id,st)}${!x.e.fixed?(night?`<button class="mini" data-a="repair" data-i="${x.i}" ${canPay(p,q.cost)?'':'disabled'}>Repair ${costHtml(q.cost)}</button>`:`<span class="cc dim">broken · ${costHtml(q.cost)}</span>`):''}</div>`;
  };
  let sets='',singles='';
  for(const sym in bySym){
    const list=bySym[sym];
    const L=list.find(x=>EQ[x.e.id].side==='L'),R=list.find(x=>EQ[x.e.id].side==='R');
    if(L&&R){const full=L.e.fixed&&R.e.fixed;sets+=`<div class="eqset ${full?'full':''}" title="Matching halves">${full?'<span class="bp">+1 SP</span>':''}${one(L)}${one(R)}</div>`}
    else list.forEach(x=>singles+=one(x));
  }
  return sets+singles||'<span class="muted">None yet.</span>';
}
function bunkerHtml(p,chg){
  const night=V.night&&V.night.p===p;
  const sc=scoreOf(p);

/* ---------- effects ---------- */
function anchor(target){
  let el=null;
  if(target&&target.loc)el=document.querySelector(`.node[data-loc="${target.loc}"]`);
  else if(target&&target.p!=null)el=document.querySelector(`.tab[data-i="${target.p}"]`);
  const r=el?el.getBoundingClientRect():$('#board').getBoundingClientRect();
  return{x:r.left+r.width/2,y:r.top+(el?Math.min(r.height*.4,34):40),key:(target&&(target.loc||'p'+target.p))||'x'};
}
function popFx(target,text,kind){
  if(!V.live)return;
  const a=anchor(target);
  const now=Date.now();
  const arr=(V.pops[a.key]=(V.pops[a.key]||[]).filter(t=>now-t<1700));
  const off=arr.length*28;arr.push(now);
  const el=document.createElement('div');
  el.className='pop '+(kind||'');
  el.innerHTML=ic(esc(tr(text)));
  el.style.left=Math.max(60,Math.min(innerWidth-60,a.x))+'px';
  el.style.top=Math.max(8,a.y-off)+'px';
  $('#fxlayer').appendChild(el);
  setTimeout(()=>el.remove(),1950);
  if(target&&target.loc&&V.anim){V.flash[target.loc]=now+800}
  sfx({gain:'gain',hunt:'hunt',hit:'hit',loss:'loss',good:'good',surv:'surv','surv-':'survLoss',rad:'rad',feed:'feed',build:'build'}[kind]||'select');
}
async function ghostMove(p,h,from,to){
  const hi=p.heroes.indexOf(h);
  const src=document.querySelector(`.hero[data-p="${p.id}"][data-hi="${hi}"]`);
  const dstNode=document.querySelector(`.node[data-loc="${to}"]`);
  sfx('move');
  if(!V.anim||!src||!dstNode){await wait(250*scale());return}
  const a=src.getBoundingClientRect();
  const center=k=>{const n=document.querySelector(`.node[data-loc="${k}"] .hrow`)||document.querySelector(`.node[data-loc="${k}"]`);const r=n.getBoundingClientRect();return{x:r.left+Math.min(r.width,60)/2+8,y:r.top+r.height/2}};
  const path=[];
  if(!ADJ[from].includes(to)){const mid=ADJ[from].find(m=>ADJ[m].includes(to));if(mid)path.push(center(mid))}
  path.push(center(to));
  const g=src.cloneNode(true);g.classList.add('ghost');g.removeAttribute('data-a');g.style.left=a.left+'px';g.style.top=a.top+'px';
  g.style.width=a.width+'px';g.style.height=a.height+'px';
  document.body.appendChild(g);src.style.visibility='hidden';
  const frames=[{transform:'translate(0,0) scale(1.2)'}];
  path.forEach(c=>frames.push({transform:`translate(${c.x-a.left-a.width/2}px,${c.y-a.top-a.height/2}px) scale(${frames.length===path.length?1.2:1.35})`}));
  const dur=Math.max(180,620*scale())*path.length;
  try{const an=g.animate(frames,{duration:dur,easing:'ease-in-out',fill:'forwards'});await an.finished}catch(e){await wait(dur)}
  g.remove();
}

  infoeq(t){const id=t.dataset.id,e=EQ[id],mate=Object.keys(EQ).find(k=>EQ[k].sym===e.sym&&k!==id);

  recmax(){V.recN=recruitMax(V.night.p);renderAll()},

  move(t){moveToRoom(V.night.p,+t.dataset.i,+t.dataset.n);sfx('select');renderAll()},
  async build(t){if(V.busy)return;V.busy=true;try{await buildRoom(V.night.p,+t.dataset.i)}finally{V.busy=false}renderAll()},
  repair(t){repairEq(V.night.p,+t.dataset.i);renderAll()},

function ringSvg(){
  const pts={forest:[20,18],dam:[90,12],mb:[160,18],bc:[20,60],sp:[160,60],fair:[20,102],cargo:[90,108],mine:[160,102]};
  const ring=['forest','dam','mb','sp','mine','cargo','fair','bc'];
  let s=`<svg viewBox="0 0 180 120" width="260" aria-label="Eight Locations connected in a ring of arrows">`;
  ring.forEach((a,i)=>{const b=ring[(i+1)%8],A=pts[a],B=pts[b];const dx=B[0]-A[0],dy=B[1]-A[1],l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l;
    const x1=A[0]+ux*13,y1=A[1]+uy*13,x2=B[0]-ux*15,y2=B[1]-uy*15;
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#c9e86a" stroke-width="1.6"/><path d="M${x2} ${y2}l${-ux*5-uy*3} ${-uy*5+ux*3}l${uy*6} ${-ux*6}z" fill="#c9e86a"/><path d="M${x1} ${y1}l${ux*5-uy*3} ${uy*5+ux*3}l${uy*6} ${-ux*6}z" fill="#c9e86a"/>`});
  ring.forEach(k=>{const p=pts[k];s+=`<circle cx="${p[0]}" cy="${p[1]}" r="11" fill="#1a1f17" stroke="#6f8f4a"/><text x="${p[0]}" y="${p[1]+3}" font-size="7" fill="#e8e4d9" text-anchor="middle">${LOCS[k].n.split(' ').map(w=>w[0]).join('')}</text>`});
  s+=`<circle cx="90" cy="60" r="16" fill="#27546a" opacity=".6"/></svg>`;
  return s;
}

    const list=document.createElement('div');list.className='seats';
    const draw=()=>{
      cnt.innerHTML='<span>Players</span>'+[2,3,4].map(k=>`<button class="${k===n?'on':''}" data-k="${k}">${k}</button>`).join('');
      cnt.querySelectorAll('button').forEach(b=>b.onclick=()=>{n=+b.dataset.k;draw()});
      list.innerHTML='';
      for(let i=0;i<n;i++){
        const s=seats[i];const row=document.createElement('div');row.className='seat';row.style.setProperty('--c',COLORS[i].hex);
        row.innerHTML=`<span class="dot" style="background:${COLORS[i].hex}"></span><input value="${esc(s.name||AI_NAMES[i-1]||((I18N.lang==='cs'?'Hráč ':'Player ')+(i+1)))}" maxlength="14"><button class="tg ${s.h?'on':''}">${s.h?'Human':'AI'}</button>`;
        row.querySelector('input').oninput=e=>{s.name=e.target.value};
        row.querySelector('.tg').onclick=()=>{s.h=!s.h;draw()};
        list.appendChild(row);
      }
    };
    draw();box.appendChild(cnt);box.appendChild(list);
    const hint=document.createElement('p');hint.className='mtext muted';hint.textContent='Mix humans and AI freely — all-human games work as hot-seat (the device is passed around). Switch every seat to AI to just watch.';box.appendChild(hint);
    const row=document.createElement('div');row.className='mrow';
    row.appendChild(btn('Back','',()=>done(null)));
    row.appendChild(btn('Start game','pri',()=>done({players:seats.slice(0,n).map((s,i)=>({name:(s.name||'').trim()||('Player '+(i+1)),human:s.h}))})));
    box.appendChild(row);
  });
  if(cfg)launch(cfg,{});
}
async function launch(cfg,opts){
  opts=opts||{};
  abortGame();
  V.cfg=cfg;V.tut=!!opts.tut;V.coached={};V.logs=[];V.view=0;V.live=true;V.prev={};V.cap='';V.flash={};V.shake={};
  $('#menu').classList.remove('on');$('#app').classList.add('live');
  seedRng(opts.seed||(Date.now()&0x7fffffff));
  Sound.unlock();Sound.setMood('day');renderCluster();
  const g=V.gen;
  try{await runGame(cfg)}
  catch(err){
    if(g!==V.gen)return;
    console.error(err);
    openModal((box,done)=>{head(box,'Something broke',esc(err&&err.message||String(err)));box.appendChild(btn('Back to menu','pri',()=>{done();showMenu()}))});
  }
}
document.addEventListener('DOMContentLoaded',()=>{
  $('#ver').textContent='Outlive · '+VERSION;
  window.__outlive={launch,showMenu,V,ART};
  showMenu();
  loadArt().then(()=>{if(G&&G.loc&&G.loc.forest)renderAll()}).catch(()=>{});
});
})();

</script>
