<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Outlive</title>
<style>
:root{
  --bg:#0e1013;--panel:#171a1f;--panel2:#1e2329;--line:#2b323b;--text:#e8e4d9;--muted:#8d958f;
  --rust:#e0642c;--acid:#b9e04b;--warn:#ffb020;--danger:#ff5d4d;--ok:#5fd18a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
b{font-weight:650}
small{font-size:.8em}
.muted{color:var(--muted)}.dim{opacity:.6}.small{font-size:.82em}
#app{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);grid-template-areas:"top top" "turn turn" "ev ev" "board side" "action side";gap:10px;padding:10px max(16px,env(safe-area-inset-right)) 34px max(16px,env(safe-area-inset-left));max-width:1500px;margin:0 auto;min-height:100vh}
#top{grid-area:top;display:flex;align-items:stretch;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 150px 8px 12px;position:relative}
.brand{font-weight:800;letter-spacing:.22em;color:var(--rust);display:flex;flex-direction:column;justify-content:center;font-size:17px}
.brand small{letter-spacing:.1em;font-weight:500;color:var(--muted);font-size:9px;text-transform:uppercase}
.convoy{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;min-width:0}
.pip{border:1px solid var(--line);border-radius:8px;padding:3px 6px;background:var(--panel2);display:flex;flex-direction:column;min-width:0;line-height:1.15}
.pip .pd{font-size:9px;letter-spacing:.12em;color:var(--muted)}
.pip .pe{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pip .pr{font-size:10px;color:var(--warn)}
.pip.cur{border-color:var(--rust);box-shadow:0 0 0 1px var(--rust) inset}
.pip.past{opacity:.7}.pip.solved .pe{text-decoration:line-through;color:var(--ok)}
.tinfo{display:flex;flex-direction:column;justify-content:center;gap:4px;align-items:flex-end}
.pill{border-radius:99px;padding:2px 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line)}
.pill.day{background:#3a2d14;border-color:#6a4f1b;color:#ffd47a}
.pill.night{background:#1b2440;border-color:#334272;color:#a9bdff}
.pill.dawn{background:#3a2216;border-color:#6a3a22;color:#ffb28a}
.first{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.dot.big{width:18px;height:18px;margin:0}
.first .dot{margin:0}
.tbtn{display:flex;flex-direction:column;gap:4px}
.ib{width:30px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel2)}
#events{grid-area:ev;display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:34px}
.elabel{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--warn)}
.evc{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:#2a1b17;border:1px solid #6a3326;border-radius:9px;padding:4px 9px;line-height:1.2}
.evc b{font-size:12px;color:#ffb09a}.evc span{font-size:11px;color:var(--muted)}
.evc.small{background:#1b2a1f;border-color:#2f5a3b}.evc.small b{color:#9fe6b4}
.cc{font-size:12px;background:#0006;border-radius:5px;padding:0 4px;white-space:nowrap}
#board{grid-area:board;position:relative;aspect-ratio:16/11;background:
  radial-gradient(circle at 50% 50%,#1d2318 0,#12150f 70%),var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#board::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:5% 5%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:21%;min-width:128px;background:#1a1f17ee;border:1px solid #3b4a30;border-radius:11px;padding:5px 7px 6px;cursor:default;transition:.15s;backdrop-filter:blur(2px)}
.node.base{border-color:#8a5a3a;background:#241a15ee}
.node.dam{border-color:#3a6a8a;background:#14202aee}
.node.city{border-color:#7a6a3a;background:#231f12ee}
.node.cargo{border-color:#7a4a6a;background:#241520ee}
.nh{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#cfd8c0;margin-bottom:2px}
.pool{font-size:15px;display:flex;align-items:center;gap:5px}.pool small{color:var(--muted);font-size:10px}
.game{font-size:11px;color:#c9c3a8}
.eqs{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.spots{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:2px}
.spot{font-size:10.5px;background:#0005;border-radius:5px;padding:1px 4px;display:flex;align-items:center;gap:2px;white-space:nowrap}
.spot b{color:var(--warn);margin-right:2px}.spot.hook{opacity:.65;border:1px dashed #7a4a6a}
.spot i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-left:2px}
.hrow{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;min-height:24px}
.hero{width:24px;height:24px;border-radius:50%;border:2px solid var(--c);background:transparent;color:var(--c);font-weight:800;font-size:12px;padding:0;display:grid;place-items:center;cursor:default}
.hero.act{background:var(--c);color:#111;box-shadow:0 0 0 2px #0008,0 0 10px var(--c)}
.hero.turn{animation:pulse 1s infinite}
.hero.pick{cursor:pointer;animation:pulse 1s infinite}
.hero.sel{transform:scale(1.25);box-shadow:0 0 0 3px #fff}
@keyframes pulse{50%{box-shadow:0 0 0 5px #fff3}}
.node.dest{border-color:var(--acid);box-shadow:0 0 0 2px var(--acid),0 0 18px #b9e04b55;cursor:pointer;z-index:3}
.node.dim{opacity:.45}.node.here{border-color:#fff;box-shadow:0 0 0 2px #fff6}
.exo{font-size:9px;color:var(--warn);letter-spacing:.1em;text-transform:uppercase}
.eq{display:inline-flex;align-items:center;gap:3px;border:1px solid #4a4a3a;background:#2a2a20;border-radius:6px;padding:1px 6px;font-size:11px;white-space:nowrap}
.eq .sym{font-size:11px}
.eq.broken{border-style:dashed;opacity:.8}.eq.ready{border-color:#4a7a4a;background:#1e2f1e}.eq.used{opacity:.45}
#action{grid-area:action;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:86px}
.ahead{margin-bottom:6px}.ap{color:var(--acid);font-weight:700}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:7px}
.act{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:48px}
.act:hover{border-color:var(--acid)}.act.end{border-style:dashed;color:var(--muted)}
.act small{color:var(--muted)}
.ticker .tick{color:var(--muted);font-size:13px;padding:1px 0}.tick.good{color:#9fe6b4}.tick.bad{color:#ffb09a}.tick.event{color:#ffd47a}.tick.phase{color:#fff;font-weight:600}
#side{grid-area:side;display:flex;flex-direction:column;gap:8px;min-width:0}
#tabs{display:flex;gap:5px;flex-wrap:wrap}
.tab{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 9px;gap:2px}
.tab.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}.tab small{margin-left:6px;color:var(--muted)}
#shelter{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:9px}
.shead{display:flex;align-items:center;gap:9px}.shead .sub{font-size:11px;color:var(--muted)}.shead .sp{margin-left:auto;font-size:24px;font-weight:800;color:var(--acid);text-align:right;line-height:1}.shead .sp small{display:block;font-size:9px;color:var(--muted);letter-spacing:.1em}
.res{display:flex;flex-wrap:wrap;gap:5px}
.rc{display:inline-flex;align-items:center;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 7px}
.gauge{display:flex;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.g{flex:1;font-style:normal;font-size:9px;text-align:center;padding:3px 0;color:#0009}
.g.pos{background:#4aa86a}.g.zero{background:#9aa84a}.g.neg{background:#a8603a}
.g.neg:nth-child(n+11){background:#a83a3a}.g.on{background:#fff;color:#000;font-weight:800}
.airlock{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.al{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.al small{letter-spacing:0;text-transform:none;margin-left:6px}
.arow{display:flex;align-items:center;gap:5px;margin:2px 0}.arow small{margin-left:auto;color:#7fc3ff}
.sv{width:13px;height:13px;border-radius:50%;border:1.5px solid #556;display:inline-block;background:transparent}
.sv.f{background:var(--c);border-color:var(--c)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.room{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:3px}
.room.unbuilt{opacity:.55;border-style:dashed}.room.active{border-color:var(--acid);box-shadow:0 0 0 1px #b9e04b55 inset}.room.used{opacity:.75}
.rh{display:flex;justify-content:space-between;gap:4px}.rh b{font-size:12.5px}.up{font-size:11px;color:var(--muted);white-space:nowrap}
.rw{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}
.slots{display:flex;gap:3px;flex-wrap:wrap}
.rt{font-size:11px;color:#b8bdb4;line-height:1.25}
.ctl{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.mini{background:#0004;border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:11.5px;white-space:nowrap}
.mini.go{border-color:var(--acid);color:var(--acid)}
.eqwrap{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.eqline{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}.eqb{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.recruit{background:#1c2a1f;border:1px solid #2f5a3b;border-radius:10px;padding:7px 9px}
.stepper{display:flex;align-items:center;gap:7px;margin-top:4px}
.stepper button{width:32px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:16px}
.stepper button.mini{width:auto;font-size:12px;height:auto}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.stepper em{font-style:normal;flex:1}
.stepper.big{justify-content:center;font-size:24px;margin:10px 0}.stepper.big button{width:46px;height:42px}
#logwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
#logwrap summary{cursor:pointer;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#log{max-height:200px;overflow:auto;margin-top:6px}
.ll{font-size:12px;color:#b6bbb2;padding:1px 0}.ll.good{color:#9fe6b4}.ll.bad{color:#ffb09a}.ll.event{color:#ffd47a}.ll.phase{color:#fff;font-weight:600;border-top:1px solid var(--line);margin-top:4px;padding-top:3px}
/* modal */
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid #3a424c;border-radius:16px;padding:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px #000a}
.mbox.wide{max-width:680px}
.mbox h2{margin:0 0 6px;font-size:20px;letter-spacing:.04em}
.mtext{color:#c4c8c0;margin:6px 0 12px;line-height:1.45}
.btn{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 14px;margin-top:8px}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#111;font-weight:700}
.btn.opt{align-items:flex-start;text-align:left}.btn.opt.on{border-color:var(--acid);background:#222d1c}
.btn .bs{font-size:11.5px;color:var(--muted);font-weight:400;line-height:1.3}
.olist{display:flex;flex-direction:column}
.mrow{display:flex;gap:8px}.mrow .btn{flex:1}
.seg{display:flex;align-items:center;gap:6px;margin:10px 0}.seg span{margin-right:auto;color:var(--muted)}
.seg button{width:44px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}.seg button.on{background:var(--rust);color:#111;border-color:var(--rust);font-weight:700}
.seat{display:flex;align-items:center;gap:8px;margin:6px 0}
.seat input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit;min-width:0}
.tg{width:76px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}.tg.on{border-color:var(--acid);color:var(--acid)}
.pile{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.pile span{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
table.score{width:100%;border-collapse:collapse;margin:8px 0}table.score td,table.score th{padding:6px 5px;text-align:center;border-bottom:1px solid var(--line)}
table.score td:first-child,table.score th:first-child{text-align:left}table.score tr.win td{color:var(--acid)}
table.score small{color:var(--muted);margin-left:2px}
#app:not(.live) #top,#app:not(.live) #events,#app:not(.live) #board,#app:not(.live) #side,#app:not(.live) #action{visibility:hidden}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "turn" "ev" "board" "action" "side";padding:8px max(16px,env(safe-area-inset-right)) 34px max(16px,env(safe-area-inset-left));gap:8px}
  #top{flex-wrap:wrap}.brand{font-size:14px}.convoy{order:3;flex-basis:100%}
  #board{aspect-ratio:4/4.6}
  .node{width:30%;min-width:0;padding:4px 5px}.nh{font-size:9.5px}.pool{font-size:13px}.game{font-size:10px}
  .hero{width:21px;height:21px;font-size:11px}
  .spots{grid-template-columns:1fr}.spot{font-size:9.5px}
  .eq{font-size:10px;padding:0 4px}
  .rooms{grid-template-columns:1fr 1fr}
}
/* ===== v0.2 additions ===== */
#bsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#board{background:#14190f;transition:filter 1.2s}
#board .arrow{fill:none;stroke:#c9e86a;stroke-width:3;stroke-linecap:round;stroke-dasharray:7 9;animation:flow 1.1s linear infinite;opacity:.9;filter:drop-shadow(0 0 3px #b9e04b88)}
#board .arrowhead{fill:#c9e86a;filter:drop-shadow(0 0 3px #b9e04b88)}
@keyframes flow{to{stroke-dashoffset:-16}}
.node{overflow:hidden;z-index:2}
.node>*{position:relative;z-index:1}
.node .art{position:absolute!important;inset:0;width:100%;height:100%;z-index:0!important;opacity:.28;pointer-events:none;color:#9ab07a}
.node.base .art{color:#c9855a}.node.dam .art{color:#6aa8cf}.node.city .art{color:#c7b36a}.node.cargo .art{color:#c46aa5}
.node.flash{animation:nflash .9s}
@keyframes nflash{0%{box-shadow:0 0 0 0 #fff}30%{box-shadow:0 0 0 4px #fff8,0 0 26px #fff6}100%{box-shadow:0 0 0 0 #fff0}}
.node.shake{animation:shake .6s}
@keyframes shake{20%{transform:translate(calc(-50% - 6px),-50%)}40%{transform:translate(calc(-50% + 6px),-50%)}60%{transform:translate(calc(-50% - 4px),-50%)}80%{transform:translate(calc(-50% + 4px),-50%)}}
.node.shake{border-color:var(--danger)!important;box-shadow:0 0 22px #ff5d4d99}
.hub{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:1;width:21%;min-width:96px}
.hub .hd{font-size:11px;letter-spacing:.3em;color:#cfe;opacity:.8}
.hub .hn{font-size:clamp(34px,6vw,64px);font-weight:800;line-height:1;color:#e8f3d0;text-shadow:0 0 18px #0009}
.hub .hp{font-size:clamp(22px,3vw,30px);margin:2px 0}
.hub .hr{font-size:11px;color:var(--warn);background:#0007;border-radius:99px;padding:1px 9px;display:inline-block}
.hero{transition:transform .15s,box-shadow .15s}
.hero.turn{animation:pulse 1s infinite}
.hero.ghost{position:fixed;z-index:80;margin:0;pointer-events:none;box-shadow:0 0 0 3px #fff8,0 0 22px var(--c)}
@keyframes heroin{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.hero.arrived{animation:heroin .35s}
/* night tint */
#app.night #board{filter:saturate(.7) brightness(.78) hue-rotate(10deg)}
#sky{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity 1.6s;background:radial-gradient(ellipse at 50% 40%,#0000 45%,#04061a88 110%)}
#sky.on{opacity:1}
/* turn bar */
#turnbar{grid-area:turn;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c,#555);border-radius:12px;padding:8px 12px;min-height:50px;transition:border-color .3s,background .3s}
#turnbar.you{background:linear-gradient(90deg,#26331a,var(--panel) 70%);border-color:var(--acid);border-left-color:var(--c)}
#turnbar.ai{background:linear-gradient(90deg,#2a2218,var(--panel) 70%)}
#turnbar .who{display:flex;flex-direction:column;min-width:150px;flex:1 1 220px;line-height:1.25}
#turnbar .who b{font-size:15px;letter-spacing:.04em}
#turnbar .who b.y{color:var(--acid)}
#turnbar .cap{font-size:12.5px;color:#d6c9a8;min-height:16px}
#turnbar .spin{display:inline-block;width:12px;height:12px;border:2px solid #ffffff44;border-top-color:var(--warn);border-radius:50%;animation:spin .8s linear infinite;margin-right:7px;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
#turnbar .order{display:flex;gap:5px;flex-wrap:wrap}
.pc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:11.5px;color:var(--muted);background:var(--panel2)}
.pc .dot{margin:0;width:9px;height:9px}.pc em{font-style:normal;font-size:9px;border:1px solid #666;border-radius:4px;padding:0 3px}
.pc.cur{color:#fff;border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset,0 0 12px color-mix(in srgb,var(--c) 45%,transparent)}
.endturn{background:var(--acid);color:#17200a;border:0;border-radius:10px;padding:10px 18px;font-weight:800;letter-spacing:.04em;animation:pulseb 1.6s infinite}
.endturn:disabled{animation:none;background:var(--panel2);color:var(--muted)}
@keyframes pulseb{50%{box-shadow:0 0 0 6px #b9e04b33}}
/* floating pops */
#fxlayer{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.pop{position:fixed;transform:translate(-50%,0);font-weight:800;font-size:18px;white-space:nowrap;padding:2px 10px;border-radius:99px;background:#000c;border:1.5px solid #fff5;color:#fff;text-shadow:0 1px 2px #000;animation:rise 1.9s ease-out forwards}
.pop.gain,.pop.hunt{color:#c9ff7a;border-color:#8fd04a}.pop.good,.pop.surv,.pop.build,.pop.feed{color:#9fe6b4;border-color:#5fd18a}
.pop.loss,.pop.hit,.pop.rad,.pop[class*="surv-"]{color:#ffb09a;border-color:#ff5d4d}
.pop.big{font-size:22px}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}12%{opacity:1;transform:translate(-50%,0) scale(1.15)}22%{transform:translate(-50%,-4px) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62px) scale(1)}}
/* banner */
#banner{position:fixed;left:0;right:0;top:34%;z-index:75;text-align:center;pointer-events:none;opacity:0;transform:scaleY(.4)}
#banner.on{animation:bann 2.4s ease-in-out forwards}
@keyframes bann{0%{opacity:0;transform:scaleY(.2)}12%{opacity:1;transform:scaleY(1)}85%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(.2)}}
#banner .bb{display:inline-block;min-width:min(520px,92vw);padding:16px 24px 14px;background:linear-gradient(90deg,#0000,#000d 15%,#000d 85%,#0000);}
#banner h1{margin:0;font-size:clamp(30px,6vw,54px);letter-spacing:.3em;text-transform:uppercase;color:var(--rust);text-shadow:0 0 24px #e0642c88;padding-left:.3em}
#banner.night h1{color:#9db4ff;text-shadow:0 0 24px #4a6aff88}
#banner p{margin:4px 0 0;color:#d9d3c0;font-size:13px;letter-spacing:.08em}
/* quick icons / pause */
#cluster{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));z-index:60;display:none;gap:6px}
#cluster.on{display:flex}
.ibtn{width:40px;height:40px;border-radius:11px;border:1px solid #3a424c;background:#171a1fee;display:grid;place-items:center;backdrop-filter:blur(3px)}
.ibtn:hover{border-color:var(--rust)}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn.off{color:#7a7f78}.ibtn.off .x{display:block}.ibtn .x{display:none}
#ver{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(6px,env(safe-area-inset-bottom));font-size:11px;color:#8d958f;opacity:.85;z-index:90;pointer-events:none;letter-spacing:.06em;text-shadow:0 1px 3px #000}
/* settings widgets */
.setrow{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap}
.setrow>span{flex:1 1 120px}
.sw{width:48px;height:26px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);position:relative;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#777;transition:.2s}
.sw.on{background:#2c3f1a;border-color:var(--acid)}.sw.on::after{left:25px;background:var(--acid)}
input[type=range]{accent-color:var(--rust);width:140px;max-width:40vw}
.segb{display:flex;gap:4px}.segb button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px;font-size:12.5px}.segb button.on{background:var(--rust);color:#111;border-color:var(--rust);font-weight:700}
/* main menu */
#menu{position:fixed;inset:0;z-index:40;display:none;overflow:hidden;background:linear-gradient(#0a0d14,#1d1612 62%,#2a1b10)}
#menu.on{display:block}
#menu svg.scene{position:absolute;inset:0;width:100%;height:100%}
#menu .mc{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));overflow:auto}
#menu h1{margin:0;font-size:clamp(46px,11vw,110px);letter-spacing:.22em;padding-left:.22em;color:#e8c9a0;text-shadow:0 0 30px #e0642c99,0 4px 0 #5a2a10;font-weight:900;animation:flick 6s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.7}94%{opacity:1}96%{opacity:.8}}
#menu .tag{color:#c9b79a;letter-spacing:.35em;text-transform:uppercase;font-size:12px;margin:2px 0 26px;padding-left:.35em;text-align:center}
#menu .mbtns{display:flex;flex-direction:column;gap:9px;width:min(330px,100%)}
#menu .mbtns button{background:#171a1fcc;border:1px solid #5a4a3a;border-radius:11px;padding:13px 16px;font-size:16px;letter-spacing:.12em;text-transform:uppercase;transition:.15s;backdrop-filter:blur(3px)}
#menu .mbtns button:hover{background:var(--rust);color:#14100c;border-color:var(--rust);transform:translateX(4px)}
#menu .mbtns button.pri{background:var(--rust);color:#14100c;font-weight:800;border-color:var(--rust)}
#menu .hint{margin-top:16px;color:#a99a80;font-size:12px;min-height:16px}
.dust{animation:drift linear infinite}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-120px,40px)}}
/* pause */
#pausem{position:fixed;inset:0;z-index:95;background:#000c;display:none;align-items:center;justify-content:center;padding:12px}
#pausem.on{display:flex}
/* coach */
#coach{position:fixed;left:50%;transform:translateX(-50%);bottom:max(30px,env(safe-area-inset-bottom));z-index:48;width:min(560px,calc(100vw - 32px));background:#1e2a14f2;border:1.5px solid var(--acid);border-radius:14px;padding:12px 14px;box-shadow:0 10px 40px #000a;display:none;animation:coachin .4s}
#coach.on{display:block}
@keyframes coachin{from{opacity:0;transform:translate(-50%,20px)}}
#coach .ct{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--acid);margin-bottom:3px}
#coach .cb{font-size:14px;line-height:1.45;color:#e6ecd6}
#coach .cr{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
#coach button{border:1px solid var(--acid);background:transparent;color:var(--acid);border-radius:8px;padding:5px 12px}
/* tutorial slides */
.slide{text-align:center}
.slide .viz{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 12px;font-size:30px;min-height:90px}
.slide .viz svg{max-width:100%;height:auto}
.dots{display:flex;justify-content:center;gap:6px;margin:6px 0}.dots i{width:8px;height:8px;border-radius:50%;background:#444}.dots i.on{background:var(--rust)}
.chg{animation:chg .9s}
@keyframes chg{0%{background:#b9e04b;color:#000}100%{background:var(--panel2)}}
.aiplay .hero.turn{box-shadow:0 0 0 4px #fff7,0 0 16px var(--c)}
@media (max-width:900px){
  #top{padding-right:130px}
  .hub{width:24%}
  #banner{top:26%}
  #turnbar .order{display:none}
}
@media (prefers-reduced-motion:reduce){#board .arrow{animation:none}}
#app{grid-template-rows:auto auto auto auto 1fr}
#action{align-self:start}
@media (max-width:900px){#app{grid-template-rows:none}}
.hrow .hero{flex:0 0 auto;align-self:flex-start;aspect-ratio:1}

/* custom art */
#board.map{background-size:100% 100%;background-position:center}
#board.map .node{background:#0b0f08b8!important;backdrop-filter:blur(1px)}
#board.map .arrow{stroke:#d7f07a;stroke-width:3.5}
.por{width:44px;height:56px;object-fit:cover;border-radius:8px;border:1px solid #5a4a3a;flex:none;margin-right:8px}
.por.sm{width:30px;height:38px;margin:0 8px 0 0}
.por.map{width:70px;height:56px}
.por.ph{display:inline-grid;place-items:center;background:#222;color:#777}
.btn.opt.haspor .bl{display:flex;align-items:center;text-align:left}
.shead .por.sm{margin-right:0}
.artrow{display:flex;align-items:center;gap:6px;margin:6px 0}
.al2{flex:1;display:flex;align-items:center;min-width:0}
.al2 input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--text);font:inherit}
#board.map .node.dim{opacity:.75}
.langrow{margin-top:10px;display:flex;justify-content:center}.mini{padding:6px 14px}

</style>
</head>

<p><b>Mapa.</b> 8 lokací tvoří jeden okruh spojený obousměrnými zelenými šipkami. Hrdina se pohne o <b>1–2 pole</b> po šipkách a nesmí skončit v lokaci, kde už je jiný hrdina jeho barvy.</p>
<p><b>Hrdinové</b> mají sílu 5/4/3/3 = akční body (AP). Příchod k slabším <i>aktivním</i> hrdinům umožní vyvinout <b>nátlak</b>: odevzdají 1 potravinu/materiál za každý bod rozdílu síly — nebo utratí 💥 střelivo na obranu.</p>
<p><b>Noc:</b> zaplaťte potraviny (🍖💧🥫) za každou obsazenou místnost a 💧 za každou použitou řadu přechodové komory, jinak přeživší zahynou. Přeživší v komoře pohlcují radiaci. Efekt místnosti funguje, jen když je <i>každé</i> pole obsazeno; přeživší v místnostech už nikdy neodejdou.</p>
<p><b>Body:</b> zažehnané události + plně obsazené místnosti (1→0, 2→1, 3→2, 4→4, 5→7, 6→11, 7→17) + stupeň radioaktivity + přeživší + opravené vybavení (+1 za každou dvojici stejných symbolů).</p>
<p class="muted">Remíza: nejvíce potravin, poté nejvíce materiálů + střeliva.</p>`;
  const SLIDES_CS=[
    {t:'Vítejte v pustině',h:'Svět skončil. Za <b>6 dní</b> dorazí Konvoj a zachrání úkryty, které ještě stojí. Vedete kmen přeživších — vyhraje ten, kdo bude mít při jeho příjezdu nejvíc <b>bodů přežití</b>.'},
    {t:'Den, noc, den…',h:'<b>Úsvit:</b> lokace se doplní a objeví se událost Konvoje.<br><b>Den:</b> hráči se střídají v pohybu hrdinů a sběru surovin.<br><b>Noc:</b> nakrmte přeživší, vydržte radiaci, naverbujte, stavějte a opravujte.'},
    {t:'Mapa je okruh',h:'8 lokací je propojeno jedním okruhem obousměrných zelených šipek. Každý hrdina se pohybuje o <b>1 nebo 2 pole</b> po šipkách. Máte 4 hrdiny se silou <b>5, 4, 3, 3</b>. Klepněte na svítícího hrdinu a poté na zvýrazněnou lokaci.'},
    {t:'Akce a nátlak',h:'Po pohybu má hrdina <b>akční body = síla</b>. Utratíte je za sběr, lov, prohledávání měst nebo sbírání vybavení. Pokud dorazíte k <i>slabším aktivním</i> hrdinům, můžete na ně vyvinout <b>nátlak</b>: musí vám dát suroviny (nebo utratit 💥 střelivo).'},
    {t:'Přežít noc',h:'Každou noc stojí každá místnost s přeživšími <b>potraviny</b>. Radiace roste každým dnem; přeživší čekající v <b>přechodové komoře</b> ji pohlcují. Zažehnáním událostí (zaplacením ceny) zrušíte jejich kletbu a získáte body.'},
    {t:'Váš úkryt',h:'<b>Naverbujte</b> přeživší do přechodové komory a pak je <b>přesuňte do místností</b>. Místnost funguje, jen když je každé pole plné — a přeživší v místnostech už nikdy neodejdou. <b>Stavějte</b> místnosti za materiály, <b>opravujte</b> rozbité vybavení pro bonusy.'},
    {t:'Bodování',h:'Body získáte za zažehnané události, <b>plně obsazené místnosti</b> (1→0, 2→1, 3→2, 4→4, 5→7, 6→11, 7→17), stupeň radioaktivity, přeživší a opravené vybavení (+1 za každou odpovídající dvojici).'},
    {t:'Připraveni? Zahrajte si vedenou hru',h:'Tutoriálová hra je krátká skutečná partie proti jednomu soupeři. Nápovědy se objevují dole na obrazovce podle toho, co se děje — zavřete je tlačítkem „Rozumím“.'}
  ];

  /* ---- engine ---- */
  const sub=(tpl,mm)=>tpl.replace(/\{(\d)\}/g,(_,i)=>tr(mm[i]||'')).replace(/\$(\d)/g,(_,i)=>mm[i]||'');
  function gloss(c){
    const out=c.replace(GRE,(m,_g,off)=>{
      let v=GLOSS[m];
      const pre=c.slice(0,off);
      if(/^[A-Z]/.test(m)&&/^[a-zěščřžýáíéúůďťňó]/.test(v)&&(pre===''||/(^|[·.:!?—-])\s*(\p{Extended_Pictographic}\uFE0F?\s*)?$/u.test(pre)))v=v[0].toUpperCase()+v.slice(1);
      return v;
    });
    return out;
  }
  function post(r,c){return c.length<=3?r:r.replace(/\bSP\b/g,'BP').replace(/\bEnd (\d)/g,'Vytr. $1')}
  function core(c){
    let bullet='';if(c.startsWith('• ')){bullet='• ';c=c.slice(2)}
    let r=EXACT[c];
    if(r===undefined){for(const [re,t] of RULES){const mm=re.exec(c);if(mm){r=sub(t,mm);break}}}
    if(r===undefined)r=gloss(c);
    return bullet+post(r,c);
  }
  function tr(s){
    if(lang!=='cs'||!s)return s;
    const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(s);if(!m[2])return s;
    const o=core(m[2]);return o===m[2]?s:m[1]+o+m[3];
  }

  /* ---- live page translation ---- */
  const tm=new WeakMap(),am=new WeakMap(),ATTR=['title','aria-label','placeholder'];
  function doText(n){
    const cur=n.data,m=tm.get(n);
    if(lang!=='cs'){if(m&&cur===m.cs)n.data=m.en;return}
    if(m&&cur===m.cs)return;
    if(!/[A-Za-z]/.test(cur))return;
    const cs=tr(cur);tm.set(n,{en:cur,cs});if(cs!==cur)n.data=cs;
  }
  function doAttr(el,a){
    const cur=el.getAttribute(a);if(cur==null)return;
    let rec=am.get(el);if(!rec){rec={};am.set(el,rec)}
    const m=rec[a];
    if(lang!=='cs'){if(m&&cur===m.cs)el.setAttribute(a,m.en);return}
    if(m&&cur===m.cs)return;
    const cs=tr(cur);rec[a]={en:cur,cs};if(cs!==cur)el.setAttribute(a,cs);
  }
  const SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1};
  function walk(root){
    if(root.nodeType===3){doText(root);return}
    if(root.nodeType!==1||SKIP[root.tagName])return;
    if(root.id==='fxlayer'&&false)return;
    for(const a of ATTR)if(root.hasAttribute&&root.hasAttribute(a))doAttr(root,a);
    const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>n.nodeType===1&&SKIP[n.tagName]?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    let n;while((n=tw.nextNode())){if(n.nodeType===3)doText(n);else for(const a of ATTR)if(n.hasAttribute(a))doAttr(n,a)}
  }
  let mo=null;
  function start(){
    if(mo||typeof MutationObserver==='undefined'||!document.body)return;
    mo=new MutationObserver(ms=>{
      if(lang!=='cs')return;
      for(const m of ms){
        if(m.type==='childList')m.addedNodes.forEach(walk);
        else if(m.type==='characterData')doText(m.target);
        else if(m.type==='attributes')doAttr(m.target,m.attributeName);
      }
    });
    mo.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTR});
    walk(document.body);
  }
  const api={
    get lang(){return lang},
    tr,
    set(l){
      if(l!=='cs'&&l!=='en')return;lang=l;
      try{localStorage.setItem('outlive.lang',l)}catch(e){}
      document.documentElement.lang=l;
      if(document.body)walk(document.body);
      document.title=l==='cs'?'Pustina (Outlive)':'Outlive';
    },
    coach(key,en){return lang==='cs'&&COACH[key]?COACH[key]:en},
    rules(en){return lang==='cs'?RULES_CS:en},
    slide(i,en){return lang==='cs'&&SLIDES_CS[i]?SLIDES_CS[i]:en},
    about(en,v){return lang==='cs'?ABOUT.replace('{V}',v):en},
    start
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{document.documentElement.lang=lang;start()});
  else{document.documentElement.lang=lang;start()}
  return api;
})();

/* =====================================================================
   OUTLIVE — procedural audio (Web Audio). No samples: music and effects
   are synthesised at runtime, so there is nothing to download.
   ===================================================================== */
const Sound=(function(){
  const S={music:true,sfx:true,mv:.55,sv:.8};
  try{const v=JSON.parse(localStorage.getItem('outlive.audio')||'null');if(v)Object.assign(S,v)}catch(e){}
  const save=()=>{try{localStorage.setItem('outlive.audio',JSON.stringify(S))}catch(e){}};
  let ctx=null,master,musicBus,sfxBus,reverb,wet,noiseBuf,droneO=[],droneF,windF,windG,delay,mood='menu',timer=null,started=false;
  let nextPad=0,nextNote=0,nextClang=0,nextBeat=0,rootNow=55;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const hz=(f0,st)=>f0*Math.pow(2,st/12);

  function impulse(sec,decay){
    const rate=ctx.sampleRate,len=rate*sec,b=ctx.createBuffer(2,len,rate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}
    return b;
  }
  function init(){
    if(ctx)return true;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    try{ctx=new AC()}catch(e){return false}
    master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);
    musicBus=ctx.createGain();musicBus.gain.value=S.music?S.mv:0;
    sfxBus=ctx.createGain();sfxBus.gain.value=S.sfx?S.sv:0;
    reverb=ctx.createConvolver();reverb.buffer=impulse(3.4,2.6);
    wet=ctx.createGain();wet.gain.value=.55;
    musicBus.connect(master);musicBus.connect(reverb);reverb.connect(wet);wet.connect(master);
    sfxBus.connect(master);
    const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;noiseBuf=nb;
    // echo for lonely notes
    delay=ctx.createDelay(1.5);delay.delayTime.value=.46;
    const fb=ctx.createGain();fb.gain.value=.42;const dl=ctx.createBiquadFilter();dl.type='lowpass';dl.frequency.value=1700;
    delay.connect(dl);dl.connect(fb);fb.connect(delay);dl.connect(musicBus);
    buildDrone();
    return true;
  }
  function buildDrone(){
    const g=ctx.createGain();g.gain.value=.22;
    droneF=ctx.createBiquadFilter();droneF.type='lowpass';droneF.frequency.value=190;droneF.Q.value=2;
    [['sawtooth',1,-7],['sawtooth',1,6],['sine',.5,0],['triangle',2,0]].forEach(([t,m,det])=>{
      const o=ctx.createOscillator();o.type=t;o.frequency.value=55*m;o.detune.value=det;
      const og=ctx.createGain();og.gain.value=t==='sine'?.9:.35;o.connect(og);og.connect(droneF);o.start();droneO.push({o,m});
    });
    droneF.connect(g);g.connect(musicBus);
    const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.045;lg.gain.value=70;lfo.connect(lg);lg.connect(droneF.frequency);lfo.start();
    // wind
    const ns=ctx.createBufferSource();ns.buffer=noiseBuf;ns.loop=true;
    windF=ctx.createBiquadFilter();windF.type='bandpass';windF.frequency.value=620;windF.Q.value=.9;
    windG=ctx.createGain();windG.gain.value=.05;
    const l2=ctx.createOscillator(),l2g=ctx.createGain();l2.frequency.value=.07;l2g.gain.value=260;l2.connect(l2g);l2g.connect(windF.frequency);l2.start();
    const l3=ctx.createOscillator(),l3g=ctx.createGain();l3.frequency.value=.11;l3g.gain.value=.03;l3.connect(l3g);l3g.connect(windG.gain);l3.start();
    ns.connect(windF);windF.connect(windG);windG.connect(musicBus);ns.start();
  }
  const MOODS={
    menu:{root:55,pads:[[0,7,12,15],[-4,3,8,12],[-7,0,5,10]],scale:[0,3,5,7,10,12,15,17],noteGap:[3,6],wind:.05,beat:false,cut:190},
    day:{root:55,pads:[[0,7,12,15],[-4,3,8,12],[-2,5,10,14],[-7,0,5,9]],scale:[0,3,5,7,10,12,15],noteGap:[2.6,5.5],wind:.06,beat:false,cut:230},
    night:{root:49,pads:[[0,7,13,15],[-4,3,8,13],[0,5,10,13]],scale:[0,1,5,7,8,12,13],noteGap:[4,8],wind:.035,beat:true,cut:150},
    tense:{root:51.9,pads:[[0,6,12,13],[1,7,12,18]],scale:[0,1,6,7,13],noteGap:[3,6],wind:.07,beat:true,cut:260}
  };
  function pad(t){
    const M=MOODS[mood],ch=pick(M.pads),f0=hz(110,0)*(M.root/55);
    ch.forEach((st,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
      o.type=i%2?'triangle':'sawtooth';o.frequency.value=hz(f0,st);o.detune.value=rnd(-9,9);
      f.type='lowpass';f.frequency.value=M.cut*3.2;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+3.2);g.gain.linearRampToValueAtTime(.035,t+6);g.gain.exponentialRampToValueAtTime(.0001,t+10.5);
      o.connect(f);f.connect(g);g.connect(musicBus);o.start(t);o.stop(t+11);
    });
  }
  function note(t){
    const M=MOODS[mood],st=pick(M.scale)+(Math.random()<.25?12:0),f=hz(220*(M.root/55),st);
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain();
    o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2.003;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+3);
    o.connect(g);o2.connect(g);g.connect(musicBus);g.connect(delay);o.start(t);o2.start(t);o.stop(t+3.1);o2.stop(t+3.1);
  }
  function clang(t){
    const base=rnd(170,320);
    [1,2.76,5.4,8.93].forEach((r,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=base*r;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05/(i+1),t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+2.2/(1+i*.4));
      o.connect(g);g.connect(musicBus);g.connect(delay);o.start(t);o.stop(t+2.4);
    });
  }
  function beat(t){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(62,t);o.frequency.exponentialRampToValueAtTime(34,t+.3);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.4);
    o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+.45);
  }
  function tick(){
    if(!ctx||!S.music)return;
    const t=ctx.currentTime,M=MOODS[mood];
    if(t>=nextPad){pad(t+.05);nextPad=t+rnd(7,10)}
    if(t>=nextNote){note(t+.05);nextNote=t+rnd(M.noteGap[0],M.noteGap[1])}
    if(t>=nextClang){clang(t+.05);nextClang=t+rnd(16,32)}
    if(M.beat&&t>=nextBeat){beat(t+.05);setTimeout(()=>{if(ctx&&S.music)beat(ctx.currentTime+.02)},330);nextBeat=t+rnd(2.2,3.2)}
  }
  function applyMood(){
    if(!ctx)return;
    const M=MOODS[mood],t=ctx.currentTime;
    droneO.forEach(d=>d.o.frequency.setTargetAtTime(M.root*d.m,t,2.5));
    droneF.frequency.setTargetAtTime(M.cut,t,2);
    windG.gain.setTargetAtTime(M.wind,t,2);
  }
  function startTimer(){if(timer)return;timer=setInterval(tick,600);tick()}
  function stopTimer(){if(timer){clearInterval(timer);timer=null}}

  /* ---- effects ---- */
  function env(g,t,a,d,peak){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
  function tone(type,f,t,a,d,peak,f2){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+d);
    env(g,t,a,d,peak);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+a+d+.05);
  }
  function nz(t,d,peak,type,f,q,f2){
    const s=ctx.createBufferSource();s.buffer=noiseBuf;
    const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=q||1;
    const g=ctx.createGain();env(g,t,.004,d,peak);s.connect(fl);fl.connect(g);g.connect(sfxBus);s.start(t,Math.random()*1.5);s.stop(t+d+.05);
  }
  const FX={
    click(t){tone('square',920,t,.001,.045,.07)},
    select(t){tone('triangle',540,t,.002,.08,.1);tone('triangle',810,t+.05,.002,.08,.08)},
    move(t){nz(t,.4,.16,'bandpass',260,1.2,1300);[0,.13,.26].forEach(d=>nz(t+d,.07,.12,'lowpass',520))},
    gain(t){[0,.07,.14].forEach((d,i)=>tone('sine',1250+i*230,t+d,.002,.2,.11))},
    hunt(t){tone('sine',140,t,.002,.28,.4,38);nz(t,.22,.25,'lowpass',900);tone('sawtooth',90,t+.12,.01,.3,.05,60)},
    hit(t){nz(t,.16,.4,'lowpass',1500);tone('sine',115,t,.002,.26,.45,44);tone('sawtooth',200,t+.02,.002,.2,.08,110)},
    loss(t){tone('sawtooth',340,t,.005,.4,.11,140)},
    good(t){[523,659,784].forEach((f,i)=>tone('triangle',f,t+i*.09,.005,.4,.13))},
    surv(t){tone('sine',660,t,.01,.45,.12);tone('sine',990,t+.1,.01,.55,.1)},
    survLoss(t){tone('sine',330,t,.01,.6,.14,150);tone('triangle',247,t+.12,.01,.6,.08,110)},
    build(t){[0,.2].forEach(d=>{nz(t+d,.09,.35,'bandpass',1800,3);tone('square',210,t+d,.002,.1,.08,130)});tone('triangle',784,t+.5,.005,.5,.09)},
    rad(t){for(let i=0;i<7;i++)nz(t+Math.random()*.6,.02,.22,'highpass',3200)},
    alarm(t){[0,.34,.68].forEach((d,i)=>tone('sawtooth',i%2?330:470,t+d,.01,.3,.09))},
    dawn(t){tone('sine',196,t,.7,1.5,.13,392);tone('triangle',294,t+.1,.7,1.4,.08,588)},
    night(t){tone('sine',370,t,.5,1.6,.13,185);tone('triangle',277,t,.6,1.5,.07,138)},
    turn(t){tone('triangle',700,t,.005,.14,.1);tone('triangle',1050,t+.11,.005,.2,.1)},
    feed(t){tone('sine',440,t,.01,.25,.08);tone('sine',554,t+.08,.01,.3,.07)},
    win(t){[392,494,587,784,988].forEach((f,i)=>tone('triangle',f,t+i*.14,.01,.9,.14))},
    lose(t){[330,262,196].forEach((f,i)=>tone('sawtooth',f,t+i*.25,.01,.7,.08))},
    open(t){tone('triangle',420,t,.003,.1,.07);tone('triangle',630,t+.04,.003,.12,.07)},
    close(t){tone('triangle',630,t,.003,.1,.06);tone('triangle',420,t+.04,.003,.12,.06)}
  };

  const api={
    state:S,
    unlock(){
      if(!init())return;
      if(ctx.state==='suspended')ctx.resume();
      if(!started){started=true;applyMood();if(S.music){const t=ctx.currentTime;nextPad=t;nextNote=t+1.5;nextClang=t+8;startTimer()}}
    },
    sfx(name){
      if(!S.sfx||!ctx||!FX[name])return;
      if(ctx.state==='suspended')ctx.resume();
      try{FX[name](ctx.currentTime+.01)}catch(e){}
    },
    setMood(m){if(!MOODS[m]||m===mood)return;mood=m;applyMood()},
    setMusic(on){
      S.music=!!on;save();if(!ctx)return;
      musicBus.gain.setTargetAtTime(S.music?S.mv:0,ctx.currentTime,.4);
      if(S.music){const t=ctx.currentTime;nextPad=t;nextNote=t+1;startTimer()}else stopTimer();
    },
    setSfx(on){S.sfx=!!on;save();if(ctx)sfxBus.gain.setTargetAtTime(S.sfx?S.sv:0,ctx.currentTime,.05)},
    setMusicVol(v){S.mv=v;save();if(ctx&&S.music)musicBus.gain.setTargetAtTime(v,ctx.currentTime,.1)},
    setSfxVol(v){S.sv=v;save();if(ctx&&S.sfx)sfxBus.gain.setTargetAtTime(v,ctx.currentTime,.05)},
    suspend(){if(ctx&&ctx.state==='running')ctx.suspend()},
    resume(){if(ctx&&ctx.state==='suspended')ctx.resume()}
  };
  document.addEventListener('visibilitychange',()=>{document.hidden?api.suspend():api.resume()});
  return api;
})();

/* ---------- rng / helpers ---------- */
let _s=(Date.now()&0xffffffff)>>>0;
function seedRng(s){_s=s>>>0}
function rand(){_s=(_s+0x6D2B79F5)>>>0;let t=_s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickOne=a=>a[Math.floor(rand()*a.length)];
const sumObj=o=>Object.values(o).reduce((a,b)=>a+b,0);
const tot=(p,l)=>l.reduce((a,r)=>a+p.res[r],0);
const nSup=p=>tot(p,SUPS),nMat=p=>tot(p,MATS);
const survivors=p=>p.air+p.rooms.reduce((a,r)=>a+r.pop,0);
const isFull=r=>r.built&&r.pop>=ROOMS[r.k].cap;
const activeRooms=(p,k)=>p.rooms.filter(r=>r.k===k&&isFull(r));
const hasRoom=(p,k)=>activeRooms(p,k).length>0;
const canUse=(p,k)=>activeRooms(p,k).some(r=>!r.used);
function useRoom(p,k){const r=activeRooms(p,k).find(r=>!r.used);if(r){r.used=true;return true}return false}
const eqReady=(p,id)=>p.equip.find(e=>e.id===id&&e.fixed&&!e.used);
function useEq(p,id){const e=eqReady(p,id);if(e){e.used=true;return true}return false}
const costStr=c=>Object.entries(c).filter(([,v])=>v>0).map(([r,v])=>v+RI[r]).join(' ')||'free';
const canPay=(p,c)=>Object.entries(c).every(([r,v])=>p.res[r]>=v);
const short=(p,c)=>Object.entries(c).reduce((a,[r,v])=>a+Math.max(0,v-p.res[r]),0);

/* ---------- game creation ---------- */
function makeGame(cfg){
  const n=cfg.players.length;
  G={n,day:0,phase:'setup',players:[],first:0,nextFirst:0,events:[],active:[],loc:{},algae:true,
     equipDeck:[],equipDisc:[],log:[],fx:{},cargoClaimed:false,over:false,humans:cfg.players.filter(x=>x.human).length,lastActor:-1,result:null};
  cfg.players.forEach((c,i)=>G.players.push({
    id:i,name:c.name||('Player '+(i+1)),human:!!c.human,color:COLORS[i],
    res:{wood:0,metal:0,chip:0,meat:0,water:0,canned:0,mun:0},
    heroes:[5,4,3,3].map(s=>({str:s,loc:null,state:'idle',spot:null,ap:0,hunted:false,unlocked:false})),
    rooms:[],air:0,rad:0,equip:[],events:[],caught:{},leader:null,cityBonus:{},report:[]}));
  G.events=shuffle(Object.keys(EVENTS)).slice(0,6);
  let deck=[];Object.keys(EQ).forEach(k=>{deck.push(k,k)});G.equipDeck=shuffle(deck);
  for(const k of Object.keys(LOC_RES))G.loc[k]={amt:0,game:[]};
  const game=[];for(let e=3;e<=7;e++)for(let i=0;i<6;i++)game.push({end:e});
  const gs=shuffle(game);let ix=0;
  for(const k of ['forest','mine','fair']){G.loc[k].game=gs.slice(ix,ix+STACK_N[n]);ix+=STACK_N[n]}
  for(const c of CITIES)G.loc[c]={search:[],disc:[],equip:[]};
  G.loc.cargo={};
  return G;
}

function drawEquipTile(){
  if(!G.equipDeck.length){G.equipDeck=shuffle(G.equipDisc);G.equipDisc=[]}
  return G.equipDeck.length?G.equipDeck.pop():null;
}
function drawEquipFor(p){
  for(let i=0;i<60;i++){
    const t=drawEquipTile();if(!t)return null;
    if(p.equip.some(e=>e.id===t)){G.equipDisc.push(t);continue}
    p.equip.push({id:t,fixed:false,used:false});log(`${pname(p)} draws ${EQ[t].n} (broken).`);return t;
  }
  return null;
}

/* ---------- setup ---------- */
async function handoff(p){
  if(G.humans>1&&p.human&&G.lastActor!==p.id){G.lastActor=p.id;const u=U();if(u&&u.handoff)await u.handoff(p)}
}
async function setupGame(){
  const u=U();
  const leaders=shuffle(LEADERS);
  let roomDeck=[];ADV_ROOMS.forEach(k=>{roomDeck.push(k,k)});roomDeck=shuffle(roomDeck);
  for(const p of G.players){
    const L2=[leaders.pop(),leaders.pop()];
    const six=[];while(six.length<6)six.push(roomDeck.pop());
    let leader,four;
    if(p.human){
      await handoff(p);
      const id=await u.chooseOne(`${p.name}: choose your Leader`,L2.map(l=>({id:l.id,label:`${l.n} (age ${l.age})`,sub:`Start: ${l.locs.map(x=>LOCS[x].n).join(', ')} · ${costStr(l.res)} · ${EQ[l.eq].n} (broken)`})),'Your Leader sets your starting locations, resources and equipment. The oldest Leader goes first.');
      leader=L2.find(l=>l.id===id);
      const sel=await u.chooseMany(`${p.name}: keep 4 of these 6 Advanced Rooms`,six.map((k,i)=>({id:String(i),label:ROOMS[k].n,sub:`${ROOMS[k].w} · ${ROOMS[k].cap} spaces · upkeep ${ROOMS[k].up} · ${ROOMS[k].t}`})),4);
      four=sel.map(i=>six[+i]);
    }else{
      leader=pickOne(L2);
      four=six.slice().sort((a,b)=>ROOMS[b].pri-ROOMS[a].pri||rand()-.5).slice(0,4);
    }
    p.leader=leader;
    p.rooms=[...STD_ROOMS,...four].map(k=>({k,built:false,pop:0,used:false}));
    // free room
    let ri;
    if(p.human){
      const id=await u.chooseOne(`${p.name}: build one Room for free`,p.rooms.map((r,i)=>({id:String(i),label:ROOMS[r.k].n,sub:`${ROOMS[r.k].w} · ${ROOMS[r.k].cap} spaces · upkeep ${ROOMS[r.k].up} · ${ROOMS[r.k].t}`})),'You start with 4 Survivors. A Room only works when every space is filled.');
      ri=+id;
    }else{
      ri=p.rooms.map((r,i)=>({i,s:ROOMS[r.k].pri-(ROOMS[r.k].cap>3?3:0)+rand()})).sort((a,b)=>b.s-a.s)[0].i;
    }
    p.rooms[ri].built=true;
    const cap=ROOMS[p.rooms[ri].k].cap;
    let inRoom=Math.min(cap,4);
    if(p.human&&inRoom>0){
      inRoom=await u.amount({title:'Starting Survivors',text:`You have 4 Survivors. How many go in ${ROOMS[p.rooms[ri].k].n} (${cap} spaces)? The rest wait in the Airlock.`,min:0,max:Math.min(cap,4),def:Math.min(cap,4)});
    }
    p.rooms[ri].pop=inRoom;p.air=4-inRoom;
    for(const r in leader.res)p.res[r]+=leader.res[r];
    p.equip.push({id:leader.eq,fixed:false,used:false});
  }
  // first player: oldest leader
  G.first=G.players.slice().sort((a,b)=>b.leader.age-a.leader.age)[0].id;G.nextFirst=G.first;
  log(`${G.players[G.first].name} has the oldest Leader and starts as First Player.`);
  // hero placement in turn order
  for(const p of order()){
    const free=p.leader.locs.slice();
    for(const h of p.heroes){
      let loc;
      if(p.human){
        await handoff(p);
        loc=await u.pickLocation(p,free,`${p.name}: place your Strength ${h.str} Hero on one of the highlighted Locations`);
      }else{
        const pref=free.slice().sort((a,b)=>(b==='cargo'&&h.str>=4?3:0)-(a==='cargo'&&h.str>=4?3:0)+(rand()-.5));
        loc=pref[0];
      }
      h.loc=loc;free.splice(free.indexOf(loc),1);render();
    }
  }
}

/* ---------- dawn ---------- */
function dawn(){
  G.phase='dawn';G.cargoClaimed=false;G.fx={sandstorm:false,epi:false,mut:false};G.algae=true;
  for(const k of Object.keys(LOC_RES))G.loc[k].amt=LOC_CAP[k][G.n];
  for(const c of CITIES){
    const s=G.loc[c];
    const t=shuffle(SEARCH_TILES),keep=STACK_N[G.n];
    s.search=t.slice(0,keep);s.disc=t.slice(keep);
    G.equipDisc.push(...s.equip);s.equip=[];
    for(let i=0;i<3;i++){const e=drawEquipTile();if(e)s.equip.push(e)}
  }
  for(const p of G.players){p.cityBonus={};p.equip.forEach(e=>e.used=false);p.rooms.forEach(r=>r.used=false);p.report=[];
    p.heroes.forEach(h=>{h.state='idle';h.spot=null;h.ap=0})}
  log(`— Day ${G.day} · Dawn: the wastelands are replenished.`,'phase');
}

/* ---------- survivors / radiation ---------- */
function removeFrom(p,where){if(where==='air')p.air--;else p.rooms[where].pop--}
async function chooseRemoval(p){
  const opts=[];
  if(p.air>0)opts.push({id:'air',label:`Airlock (${p.air})`});
  p.rooms.forEach((r,i)=>{if(r.pop>0)opts.push({id:String(i),label:`${ROOMS[r.k].n} (${r.pop}/${ROOMS[r.k].cap})`+(isFull(r)?' — ability active':'')})});
  if(!opts.length)return null;
  if(opts.length===1)return opts[0].id;
  if(p.human)return await U().chooseOne(`${p.name}: lose a Survivor — from where?`,opts);
  if(p.air>0)return 'air';
  const rs=p.rooms.map((r,i)=>({r,i})).filter(x=>x.r.pop>0).sort((a,b)=>(isFull(a.r)-isFull(b.r))||(ROOMS[a.r.k].pri-ROOMS[b.r.k].pri));
  return String(rs[0].i);
}
async function loseSurvivors(p,n,why){
  let lost=0;
  for(let i=0;i<n;i++){
    const w=await chooseRemoval(p);if(w===null)break;
    removeFrom(p,w==='air'?'air':+w);lost++;
  }
  if(lost){pop(P_(p),`-${lost}👤`,'surv-');log(`${pname(p)} loses ${lost} Survivor${lost>1?'s':''}${why?' ('+why+')':''}.`,'bad');p.report.push(`Lost ${lost} Survivor${lost>1?'s':''}${why?' — '+why:''}.`)}
  return lost;
}
async function addRad(p,n,why){
  if(n<=0)return;
  const t=p.rad-n;

function effStr(p,h){return(G.fx.sandstorm&&!hasRoom(p,'bunker'))?Math.min(3,h.str):h.str}
function cargoOptions(p,h){
  const s=effStr(p,h),hook=!!eqReady(p,'hook'),dock=canUse(p,'dock'),out=[];
  CARGO_SPOTS.forEach((sp,i)=>{
    const needHook=sp.s===s+1;
    if(!(sp.s===s||(hook&&needHook)))return;
    const occ=G.players.some(q=>q.heroes.some(x=>x.loc==='cargo'&&x.state==='act'&&x.spot===i));
    if(occ&&!(dock&&sp.s===s))return;
    out.push({i,hook:needHook,occ});
  });
  return out;
}
function destinations(p,h){
  const exo=!!eqReady(p,'exo'),maxD=exo?9:2;
  const dist={[h.loc]:0},q=[h.loc];
  while(q.length){const u=q.shift();if(dist[u]>=maxD)continue;for(const v of ADJ[u])if(!(v in dist)){dist[v]=dist[u]+1;q.push(v)}}
  const out=[];
  for(const loc in dist){
    if(loc===h.loc)continue;
    if(p.heroes.some(o=>o!==h&&o.loc===loc))continue;
    if(loc==='cargo'&&cargoOptions(p,h).length===0)continue;
    out.push({loc,dist:dist[loc],exo:dist[loc]>2});
  }
  return out;
}

function removeLoc(k,n){const l=G.loc[k];const r=Math.min(n,l.amt);l.amt-=r;if(r)log(`${LOCS[k].n} loses ${r} ${RN[LOC_RES[k]]}.`,'event')}
async function chooseSupplyToLose(p,pool,title){

async function applyEvents(){

      case'rats':for(const p of order()){

      case'clan':for(const p of order()){

        if(tot(p,[...MATS,'mun'])>=2){for(let i=0;i<2;i++){const r=await chooseSupplyToLose(p,pool(),`${p.name}: Enemy Clan raid! Lose a Material/Munition (${i+1}/2)`);p.res[r]--}log(`The Enemy Clan raids ${pname(p)} (-2 tokens).`,'event');pop(P_(p),'-2 raided','loss');p.report.push('Enemy Clan raided 2 tokens.')}

async function heroTurn(p){

async function applyPressure(p,h){
  const targets=[];
  for(const q of order())if(q!==p)for(const d of q.heroes)if(d.loc===h.loc&&d.state==='act'&&d.str<h.str)targets.push({q,d});

    if(pts>0&&eqReady(q,'gear')){useEq(q,'gear');pts=Math.max(0,pts-2);log(`${pname(q)}'s Battle Gear absorbs 2 Pressure.`)}
    if(pts>0&&d.str===3&&canUse(q,'guard')){useRoom(q,'guard');pts=0;log(`${pname(q)}'s Guard Post turns the Pressure aside.`)}
    if(pts>0&&q.res.mun>0){
      let m=0;
      if(q.human)m=await U().amount({title:`${q.name}: Pressure!`,text:`${p.name}'s Strength ${h.str} Hero presses your Strength ${d.str} Hero for ${pts} tribute. Spend Munitions to reduce it by 1 each?`,min:0,max:Math.min(pts,q.res.mun),def:Math.min(pts,q.res.mun)});
      else m=Math.min(pts,q.res.mun);
      if(m){q.res.mun-=m;pts-=m;log(`${pname(q)} spends ${m}${RI.mun} to resist Pressure.`);pop(L_(h.loc),`-${m}${RI.mun}`,'loss')}
    }
    const taken=[];
    for(let i=0;i<pts;i++){
      const pool=RES_ALL.filter(r=>r!=='mun'&&q.res[r]>0);
      if(!pool.length)break;
      let r;
      if(hasRoom(p,'enforcer')){
        if(p.human)r=await U().chooseOne(`${p.name}: choose your tribute from ${q.name}`,pool.map(x=>({id:x,label:`${RI[x]} ${RN[x]} (${q.res[x]})`})));
        else r=pool.slice().sort((a,b)=>resValue(p,b)-resValue(p,a))[0];
      }else{
        if(q.human)r=await U().chooseOne(`${q.name}: pay tribute to ${p.name}`,pool.map(x=>({id:x,label:`${RI[x]} ${RN[x]} (${q.res[x]})`})),'Give 1 Supply or 1 Material.');
        else r=pool.slice().sort((a,b)=>resValue(q,a)-resValue(q,b))[0];
      }
      q.res[r]--;p.res[r]++;taken.push(r);
    }
    if(taken.length){log(`${pname(p)} pressures ${pname(q)} and takes ${taken.map(r=>RI[r]).join('')}.`,'bad');pop(L_(h.loc),`${pname(q)} → ${pname(p)}: ${taken.map(r=>RI[r]).join('')}`,'hit')}
    else log(`${pname(p)} pressures ${pname(q)} — nothing gained.`);
    render();
    await sleep(450);
  }
}

/* ---------- day actions ---------- */
function resValue(p,r){
  const s=p.res[r];
  // supplies are worth more while the Tribe cannot yet cover tonight's upkeep and recruiting
  const need=(()=>{const n=supplyNeeds(p);return n.rows+n.rooms+3})();
  const sup=nSup(p),boost=sup<need?1+(need-sup)/need:1;
  switch(r){
    case'canned':return 1.5*boost*(s>10?.5:1);
    case'meat':return 1.2*boost*(s>8?.5:1);
    case'water':return 1.1*boost*(s>6?.5:1);
    case'mun':return s>=5?.25:s>=3?.5:.85;
    case'chip':return s===0?2.2:(s>=8?.5:s>=5?.8:1.1);
    default:return s>=8?.5:s>=5?.8:1.1;
  }
}
function huntInfo(p,h){
  const loc=G.loc[h.loc];
  if(!loc.game||!loc.game.length||h.hunted)return null;
  const mut=G.fx.mut&&!hasRoom(p,'bunker')?1:0,epi=G.fx.epi&&!hasRoom(p,'bunker')?1:0;
  const gear=['shotgun','trap'].filter(id=>eqReady(p,id)).length;
  const tiles=eqReady(p,'thermal')?loc.game.map((t,i)=>i):[0];
  let best=null;
  for(const i of tiles){
    const t=loc.game[i];const end=t.end+mut;
    const yld=Math.max(0,(t.end-2)+(p.caught[t.end]||0)-epi);
    const m=Math.min(p.res.mun,end);
    const need=Math.max(0,end-m-gear);
    const ok=need<=h.ap;
    const bonus=(canUse(p,'lodge')?2:0)+(canUse(p,'snares')?1:0);
    const info={i,end,yld,bonus,minNeed:need,ok,gear};
    if(ok&&(!best||(info.yld+info.bonus)>(best.yld+best.bonus)))best=info;
    if(!best&&i===tiles[0])best=info;
  }
  return best;
}
async function doHunt(p,h,idx,m){
  const loc=G.loc[h.loc];const t=loc.game[idx];
  const mut=G.fx.mut&&!hasRoom(p,'bunker')?1:0,epi=G.fx.epi&&!hasRoom(p,'bunker')?1:0;
  const end=t.end+mut;m=Math.min(m,p.res.mun,end);
  let need=end-m;
  let gearUsed=0;
  for(const id of['shotgun','trap'])if(need>h.ap&&eqReady(p,id)||(need>0&&eqReady(p,id)&&need>0)){if(need>0&&useEq(p,id)){need--;gearUsed++}}
  need=Math.max(0,need);
  if(need>h.ap)return false;
  if(idx>0&&!useEq(p,'thermal'))return false;
  if(idx===0&&eqReady(p,'thermal')&&loc.game.length>1&&false){}
  h.ap-=need;p.res.mun-=m;
  loc.game.splice(idx,1);
  const yld=Math.max(0,(t.end-2)+(p.caught[t.end]||0)-epi);
  p.caught[t.end]=(p.caught[t.end]||0)+1;
  let gain=yld;
  if(useRoom(p,'lodge'))gain+=2;
  if(useRoom(p,'snares'))gain+=1;
  p.res.meat+=gain;h.hunted=true;
  log(`${pname(p)} hunts an Endurance-${t.end} beast (${need} AP${m?`, ${m}${RI.mun}`:''}) and gets ${gain}${RI.meat}.`,'good');
  pop(L_(h.loc),`+${gain}${RI.meat}`,'hunt');
  return true;
}

    loc.equip.forEach((t,i)=>{
      if(p.equip.some(e=>e.id===t))return;
      add({id:'salv'+i,kind:'salv',ap:1,v:p.equip.filter(e=>!e.fixed).length>=3?.3:(G.day>=5?.4:.95),label:`Salvage ${EQ[t].n}`,sub:`1 AP · arrives broken · repair ${costStr(EQ[t].cost)}`,run:async()=>doSalvage(p,h,G.loc[L].equip.indexOf(t))});
    });
  }
  if(canUse(p,'intel')&&p.human)add({id:'peek',kind:'peek',ap:0,v:0,label:'Look through a Search pile',sub:'Intel Office · free',run:async()=>{
    const c=await U().chooseOne('Which City pile?',CITIES.map(x=>({id:x,label:LOCS[x].n})));
    useRoom(p,'intel');await U().showPile(c,G.loc[c].search)}});
  return A;
}
async function actionPhase(p,h){
  h.ap=effStr(p,h);
  if(h.loc==='cargo'){h.ap=0;return}
  let guard=0;
  while(guard++<40){
    const acts=listActions(p,h);
    render();
    if(!acts.length)break;
    let a;
    if(p.human)a=await U().pickAction(p,h,acts);else a=aiPickAction(p,h,acts);
    if(!a||a.id==='done')break;
    await a.run();
    if(!p.human)await sleep(180);
  }
  h.ap=0;
}

/* ---------- AI: day ---------- */
function aiPickAction(p,h,acts){
  const cand=acts.filter(a=>a.v>0.3||a.kind==='unlock');
  if(!cand.length)return null;
  cand.sort((a,b)=>(b.v/Math.max(1,b.kind==='scav'&&b.id==='sN'?b.ap:1))-(a.v/Math.max(1,a.kind==='scav'&&a.id==='sN'?a.ap:1)));
  // prefer bulk scavenging when it is the best per-AP option
  const best=cand[0];
  if(best.kind==='scav'){const bulk=cand.find(a=>a.kind==='scav'&&a.id==='sN');if(bulk)return bulk}
  return best;
}
function locValue(p,h,L,str,here){
  const k=LOCS[L].k,res=LOC_RES[L],loc=G.loc[L];let v=0;
  if(k==='cargo'){
    const o=cargoOptions(p,h);if(!o.length)return -5;
    const best=o.map(x=>CARGO_SPOTS[x.i].canned*resValue(p,'canned')+2.2).sort((a,b)=>b-a)[0];
    v=best+(G.cargoClaimed?0:.7)+(canUse(p,'depot')?1.4:0)+(canUse(p,'dock')?2.8:0)+(eqReady(p,'hacksaw')?2:0);
    return v;
  }
  if(k==='base'){
    const n=Math.min(str,loc.amt);
    v=n*resValue(p,'mun')+(G.algae&&p.rad<3?1.3:0)+(eqReady(p,'crowbar')?2.2:0);
    if(eqReady(p,'ammobox')&&n>0)v+=Math.min(2,loc.amt-n)*resValue(p,'mun');
    return v;
  }
  if(k==='dam'){
    if(!eqReady(p,'card')&&p.res.chip<1)return 0;
    const n=Math.min(str,loc.amt);
    return n*resValue(p,'water')-(eqReady(p,'card')?0:resValue(p,'chip'))+(eqReady(p,'jerrycan')&&n>0?Math.min(1,loc.amt-n):0);
  }
  if(k==='wild'){
    const n=Math.min(str,loc.amt);let sc=n*resValue(p,res);
    const bon={forest:'axe',mine:'pickaxe',fair:'backpack'}[L];
    if(bon&&eqReady(p,bon)&&n>0)sc+=Math.min(2,loc.amt-n)*resValue(p,res);
    let hv=0;
    if(loc.game.length){
      const t=loc.game[0],end=t.end+(G.fx.mut?1:0),y=Math.max(0,t.end-2+(p.caught[t.end]||0)-(G.fx.epi?1:0))+(canUse(p,'lodge')?2:0)+(canUse(p,'snares')?1:0);
      const m=Math.min(p.res.mun,Math.min(end,2)),need=Math.max(1,end-m);
      if(need<=str){hv=y*resValue(p,'meat')-m*.5+(str-need)*resValue(p,res)*.8}
    }
    v=Math.max(sc,hv);
    const vis={forest:['bow','meat',1],mine:['purifier','water',1],fair:['detector','canned',1]}[L];
    if(vis&&eqReady(p,vis[0]))v+=resValue(p,vis[1]);
    return v;
  }
  if(k==='city'){
    const n=Math.min(str,loc.search.length+loc.equip.length);
    v=n*.8+(eqReady(p,'chainsaw')?2:0)+(eqReady(p,'flashlight')?2.2:0)+(hasRoom(p,'scouts')&&!p.cityBonus['s'+L]?1.5:0);
    return v;
  }
  return 0;
}
function aiChooseMove(p){
  let best=null;
  for(let hi=0;hi<p.heroes.length;hi++){
    const h=p.heroes[hi];if(h.state!=='idle')continue;
    for(const d of destinations(p,h)){
      const str=effStr(p,h);let v=locValue(p,h,d.loc,str,[]);
      for(const q of G.players){
        if(q===p)continue;
        for(const x of q.heroes)if(x.loc===d.loc&&x.state==='act'&&x.str<h.str){
          const pts=h.str-x.str,avail=RES_ALL.filter(r=>r!=='mun').reduce((a,r)=>a+q.res[r],0);
          v+=Math.min(pts,avail)*(q.res.mun>=pts?.35:.9);
        }
      }
      if(d.exo)v-=.4;
      v+=rand()*.35;
      if(!best||v>best.v)best={hi,loc:d.loc,v};
    }
  }
  return best;
}

/* ---------- night ---------- */
function applyEventDiscount(p,cost){
  const opts=[];
  const sup=SUPS.filter(r=>cost[r]>0);
  if(sup.length){const c={...cost};const r=sup.sort((a,b)=>(c[b]-p.res[b])-(c[a]-p.res[a]))[0];c[r]--;opts.push(c)}
  const mm=[...MATS,'mun'];
  if(mm.some(r=>cost[r]>0)){const c={...cost};for(let k=0;k<2;k++){const rs=mm.filter(r=>c[r]>0).sort((a,b)=>(c[b]-p.res[b])-(c[a]-p.res[a]));if(!rs.length)break;c[rs[0]]--}opts.push(c)}
  if(!opts.length)return null;
  opts.sort((a,b)=>(short(p,a)-short(p,b))||(sumObj(a)-sumObj(b)));
  return opts[0];
}
function eventCost(p,id){
  const base=EVENTS[id].cost;
  if(canUse(p,'command')){const d=applyEventDiscount(p,base);if(d)return{cost:d,disc:true}}
  return{cost:{...base},disc:false};
}
function supplyNeeds(p,extraRooms){
  const rows=Math.ceil(p.air/AIR_ROW);
  const rooms=p.rooms.filter(r=>r.built&&r.pop>0).reduce((a,r)=>a+ROOMS[r.k].up,0);
  return{rows,rooms};
}
async function nightPhase(){
  G.phase='night';
  for(const p of G.players)for(const h of p.heroes){h.state='idle';h.spot=null}
  log(`— Day ${G.day} · Night falls.`,'phase');render();
  await fx('banner',`Night ${G.day}`,'Overcome events · feed · radiation · recruit · build · repair','night');
  // 1 events
  let passes=0,i=0,guard=0;
  const ord=order();
  while(G.active.length&&passes<G.n&&guard++<80){
    const p=ord[i%G.n];i++;
    const ch=await decideEvent(p);
    if(ch){
      const{cost,disc}=eventCost(p,ch);
      if(disc)useRoom(p,'command');
      for(const r in cost)p.res[r]-=cost[r];
      p.events.push(ch);G.active.splice(G.active.indexOf(ch),1);pop(P_(p),`+${EVENTS[ch].sp} SP`,'good');await fx('turn',p,'night');await sleep(700);
      log(`${pname(p)} Overcomes ${EVENTS[ch].n} (+${EVENTS[ch].sp} SP) for ${costStr(cost)}.`,'good');
      passes=0;render();
    }else passes++;
  }
  // 2 feed, 3 radiation
  for(const p of ord){await fx('focus',p);await feedStep(p);await sleep(500)}
  for(const p of ord){await fx('focus',p);await radStep(p);await sleep(500)}
  render();
  // 4-6
  for(const p of ord){
    if(p.human){await handoff(p);await U().nightReport(p);await U().shelter(p)}
    else await aiNight(p);
    await fx('turnEnd',p,'night');
  }
  // 7 upkeep
  for(const p of ord){p.res.meat=0;p.res.water=Math.min(p.res.water,2)}
  render();
}
async function decideEvent(p){
  const aff=G.active.filter(id=>canPay(p,eventCost(p,id).cost));
  if(!aff.length)return null;
  if(p.human){
    const opts=aff.map(id=>{const c=eventCost(p,id);return{id,label:`${EVENTS[id].n}  (+${EVENTS[id].sp} SP)`,sub:`Cost ${costStr(c.cost)}${c.disc?' (Command Post discount)':''} — ${EVENTS[id].t}`}});
    opts.push({id:'pass',label:'Pass',sub:'Let the next Tribe decide.'});
    await handoff(p);
    const r=await U().chooseOne(`${p.name}: Overcome an Event?`,opts,'Overcome Events to stop their effects and score their Survival Points.');
    return r==='pass'?null:r;
  }
  let best=null;
  for(const id of aff){
    const c=eventCost(p,id).cost;
    const after={...p.res};for(const r in c)after[r]-=c[r];
    const need=supplyNeeds(p);
    const supAfter=SUPS.reduce((a,r)=>a+after[r],0);
    if(supAfter<need.rows+need.rooms||after.water<need.rows)continue;
    const toks=sumObj(c);
    const harm=['cloud','clan','cold','rats','sandstorm','wildfire','cavein','thieves','lean'].includes(id)?1.2:.5;
    const ratio=(EVENTS[id].sp+harm*Math.max(0,6-G.day))/Math.max(1,toks);
    if(ratio>=.95&&(!best||ratio>best.r))best={id,r:ratio};
  }
  return best?best.id:null;
}
async function feedStep(p){
  const rows=Math.ceil(p.air/AIR_ROW);
  let needRows=rows,perm=hasRoom(p,'cistern')?activeRooms(p,'cistern').length:0;
  const fp=Math.min(perm,needRows);needRows-=fp;perm-=fp;
  const wu=Math.min(needRows,p.res.water);p.res.water-=wu;needRows-=wu;
  let need=p.rooms.filter(r=>r.built&&r.pop>0).reduce((a,r)=>a+ROOMS[r.k].up,0);
  const pu=Math.min(perm,need);need-=pu;
  while(need>0){
    if(p.res.meat>0)p.res.meat--;
    else if(p.res.water>2)p.res.water--;
    else if(p.res.canned>0)p.res.canned--;
    else if(p.res.water>0)p.res.water--;
    else break;
    need--;
  }
  const shortN=needRows+need;
  p.report.push(`Fed ${survivors(p)} Survivors (Airlock rows: ${rows}💧, Rooms upkeep).`);
  pop(P_(p),`fed ${survivors(p)}👤`,'feed');
  if(shortN>0){log(`${pname(p)} is short ${shortN} Supply — Survivors starve.`,'bad');await loseSurvivors(p,shortN,'starvation')}
}
async function radStep(p){
  const L=RAD_DAY[G.day-1];
  if(canUse(p,'scrubber')){useRoom(p,'scrubber');lowerRad(p,1);log(`${pname(p)}'s Scrubber lowers radiation by 1.`);pop(P_(p),'☢ −1','good')}
  const absorb=p.air+(hasRoom(p,'sealdoor')?1:0);
  const leak=Math.max(0,L-absorb);
  p.report.push(`Radiation ${L}: absorbed ${Math.min(L,absorb)}, leaked ${leak}. Gauge now ${p.rad-leak}.`);
  if(leak){log(`${pname(p)} takes ${leak} radiation.`,'bad');pop(P_(p),`☢ +${leak}`,'rad');await addRad(p,leak,'night')}
}

/* ----- night shelter operations (used by humans through the UI and by AI) ----- */
function recruitMax(p){return Math.max(0,Math.min(nSup(p),AIR_MAX-p.air))}
function paySupplies(p,n){
  for(let i=0;i<n;i++){
    if(p.res.meat>0)p.res.meat--;else if(p.res.water>2)p.res.water--;else if(p.res.canned>0)p.res.canned--;else p.res.water--;
  }
}
function recruit(p,n){n=Math.min(n,recruitMax(p));if(n<=0)return 0;paySupplies(p,n);p.air+=n;log(`${pname(p)} recruits ${n} Survivor${n>1?'s':''}.`);pop(P_(p),`+${n}👤`,'surv');return n}
function moveToRoom(p,ri,n){
  const r=p.rooms[ri];if(!r.built)return 0;
  n=Math.min(n,p.air,ROOMS[r.k].cap-r.pop);if(n<=0)return 0;
  p.air-=n;r.pop+=n;return n;
}
function autoPay(p,allowed,n){
  const pay={};let left=n;
  while(left>0){
    const r=allowed.slice().sort((a,b)=>(p.res[b]-(pay[b]||0))-(p.res[a]-(pay[a]||0)))[0];
    if(p.res[r]-(pay[r]||0)<=0)break;
    pay[r]=(pay[r]||0)+1;left--;
  }
  return pay;
}
async function payMaterials(p,n,allowed){
  allowed=allowed||MATS;
  if(n<=0)return{};
  const have=tot(p,allowed);if(have<n)return null;
  const types=allowed.filter(r=>p.res[r]>0);
  let pay;
  if(p.human&&types.length>1&&have>n)pay=await U().payDialog({title:'Choose what to pay',allowed:types,n,p});
  else pay=autoPay(p,allowed,n);
  for(const r in pay)p.res[r]-=pay[r];
  return pay;
}
function buildCost(p){return canUse(p,'foundry')?1:3}
async function buildRoom(p,ri){
  const r=p.rooms[ri];if(r.built)return false;
  const c=buildCost(p);if(nMat(p)<c)return false;
  const pay=await payMaterials(p,c);if(!pay)return false;
  if(c===1)useRoom(p,'foundry');
  r.built=true;log(`${pname(p)} builds ${ROOMS[r.k].n}.`,'good');pop(P_(p),`built ${ROOMS[r.k].n}`,'build');return true;
}
function repairQuote(p,eq){
  const cost={...EQ[eq.id].cost};const used=[];
  const reduce=k=>{
    for(let i=0;i<k;i++){
      const rs=Object.keys(cost).filter(r=>cost[r]>0).sort((a,b)=>(cost[b]-p.res[b])-(cost[a]-p.res[a]));
      if(!rs.length)return;cost[rs[0]]--;
    }
  };
  let left=sumObj(cost);
  const rooms=[['mechanic',99],['rebuild',2],['workshop',1]];
  const taken={};
  for(const[k,amt]of rooms){
    if(sumObj(cost)<=0)break;
    const n=activeRooms(p,k).filter(r=>!r.used).length-(taken[k]||0);
    if(n>0){taken[k]=(taken[k]||0)+1;used.push(k);if(amt===99)Object.keys(cost).forEach(r=>cost[r]=0);else reduce(amt)}
  }
  return{cost,used};
}
function repairEq(p,ei){
  const eq=p.equip[ei];if(!eq||eq.fixed)return false;
  const q=repairQuote(p,eq);
  if(!canPay(p,q.cost))return false;
  q.used.forEach(k=>useRoom(p,k));
  for(const r in q.cost)p.res[r]-=q.cost[r];
  eq.fixed=true;log(`${pname(p)} repairs ${EQ[eq.id].n}.`,'good');pop(P_(p),`repaired ${EQ[eq.id].n}`,'build');return true;
}
const NIGHT_ABILITY=['armory','cache','lab','scrapper','barracks'];
async function useAbility(p,ri){
  const r=p.rooms[ri];if(!r||!isFull(r)||r.used||!NIGHT_ABILITY.includes(r.k))return false;
  switch(r.k){
    case'armory':p.res.mun+=4;log(`${pname(p)} takes 4${RI.mun} from the Armory.`);break;
    case'cache':drawEquipFor(p);break;
    case'lab':drawEquipFor(p);drawEquipFor(p);break;
    case'barracks':if(r.pop>=8)return false;r.pop++;log(`${pname(p)}'s Barracks takes in a Survivor.`);break;
    case'scrapper':{
      if(!p.equip.length)return false;
      let id;
      if(p.human)id=await U().chooseOne('Destroy which Equipment?',p.equip.map((e,i)=>({id:String(i),label:`${EQ[e.id].n} (${e.fixed?'repaired':'broken'})`,sub:`Returns ${costStr(EQ[e.id].cost)}`})));
      else return false;
      const e=p.equip.splice(+id,1)[0];for(const m in EQ[e.id].cost)p.res[m]+=EQ[e.id].cost[m];log(`${pname(p)} scraps ${EQ[e.id].n}.`);break}
  }
  r.used=true;return true;
}

/* ---------- AI: night ---------- */
function nextRad(){return RAD_DAY[Math.min(5,G.day)]}
async function aiNight(p){
  const last=G.day>=6;
  await fx('turn',p,'night');await sleep(500);
  // abilities that give stuff
  for(let i=0;i<p.rooms.length;i++){
    const k=p.rooms[i].k;
    if(!isFull(p.rooms[i])||p.rooms[i].used)continue;
    if(k==='armory'||k==='barracks')await useAbility(p,i);
    if((k==='cache'||k==='lab')&&p.equip.filter(e=>!e.fixed).length<3&&G.day<=5)await useAbility(p,i);
  }
  // recruit
  const need=supplyNeeds(p);
  let budget=nSup(p);
  if(!last){
    const keep=Math.ceil(.25*(need.rows+need.rooms+2));
    budget=Math.max(0,Math.min(recruitMax(p),(p.res.meat+Math.max(0,p.res.water-2))+Math.max(0,p.res.canned-keep)));
  }else budget=recruitMax(p);
  recruit(p,budget);await sleep(650);
  const doPop=()=>aiPopulate(p,last);
  const pv=survivors(p);doPop();render();await sleep(450);
  // build / repair loop
  for(let g=0;g<6;g++){
    let did=false;
    const unbuilt=p.rooms.map((r,i)=>({r,i})).filter(x=>!x.r.built).sort((a,b)=>ROOMS[b.r.k].pri-ROOMS[a.r.k].pri);
    const builtCount=p.rooms.filter(r=>r.built).length;
    const bc=buildCost(p);
    if(unbuilt.length&&nMat(p)>=bc){
      const x=unbuilt[0];
      const cap=ROOMS[x.r.k].cap;
      const canFill=p.air>=cap-(last?0:1)||(!last&&G.day<=3);
      const sensible=builtCount<=Math.ceil(survivors(p)/3)+1;
      if(canFill&&sensible&&(!last||p.air>=cap)){if(await buildRoom(p,x.i)){did=true;doPop();render();await sleep(650)}}
    }
    if(!did){
      const broken=p.equip.map((e,i)=>({e,i})).filter(x=>!x.e.fixed).filter(x=>canPay(p,repairQuote(p,x.e).cost));
      if(broken.length){if(repairEq(p,broken[0].i)){did=true;render();await sleep(650)}}
    }
    if(!did)break;
  }
  // leftover: more recruits if possible on last night
  if(last){recruit(p,recruitMax(p));aiPopulate(p,true)}
}
function aiPopulate(p,last){
  const L=last?0:nextRad();
  const sealed=hasRoom(p,'sealdoor')?1:0;
  const nightsLeft=Math.max(0,6-G.day);
  let guard=0;
  while(p.air>0&&guard++<40){
    const cand=p.rooms.map((r,i)=>({r,i,rem:ROOMS[r.k].cap-r.pop})).filter(x=>x.r.built&&x.rem>0).sort((a,b)=>a.rem-b.rem||ROOMS[b.r.k].pri-ROOMS[a.r.k].pri);
    if(!cand.length)break;
    const x=cand[0];
    const keep=last?0:Math.max(0,L-sealed);
    const free=Math.max(0,p.air-keep);
    if(x.rem<=p.air){
      const leakNow=Math.max(0,L-sealed-p.air),leakAfter=Math.max(0,L-sealed-(p.air-x.rem));
      const cost=(leakAfter-leakNow)*nightsLeft;
      const fullCount=p.rooms.filter(isFull).length;
      const gain=ROOM_SCORE[Math.min(7,fullCount+1)]-ROOM_SCORE[fullCount]+1.2;
      if(gain>=cost){moveToRoom(p,x.i,x.rem);continue}
    }
    if(free>0){moveToRoom(p,x.i,Math.min(free,x.rem));continue}
    break;
  }
}

/* ---------- scoring ---------- */
function scoreOf(p){
  const ev=p.events.reduce((a,e)=>a+EVENTS[e].sp,0);
  const full=p.rooms.filter(isFull).length;
  const fixed=p.equip.filter(e=>e.fixed);
  const sides={};fixed.forEach(e=>{const s=EQ[e.id];(sides[s.sym]=sides[s.sym]||new Set()).add(s.side)});
  const pairs=Object.values(sides).filter(s=>s.size===2).length;
  const out={events:ev,rooms:ROOM_SCORE[full],fullRooms:full,rad:p.rad,survivors:survivors(p),equip:fixed.length,pairs};
  out.total=out.events+out.rooms+out.rad+out.survivors+out.equip+out.pairs;
  return out;
}
function finalResult(){
  const rows=G.players.map(p=>({p,s:scoreOf(p),sup:nSup(p),oth:nMat(p)+p.res.mun}));
  rows.sort((a,b)=>b.s.total-a.s.total||b.sup-a.sup||b.oth-a.oth);
  G.result=rows;return rows;
}

/* ---------- main loop ---------- */
async function runGame(cfg){
  makeGame(cfg);
  await setupGame();
  for(G.day=1;G.day<=6;G.day++){
    dawn();render();
    await fx('banner',`Day ${G.day}`,'Dawn — the wastelands are replenished','dawn');
    await dayPhase();
    await nightPhase();
  }
  G.day=6;G.phase='over';G.over=true;
  const r=finalResult();
  render();
  const u=U();if(u&&u.final)await u.final(r);
  return r;
}

</script>
<script>
/* =====================================================================
   OUTLIVE — digital prototype: user interface (v0.2)
   ===================================================================== */
(function(){
const VERSION='v0.4.0';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const V={view:0,pm:null,pa:null,pl:null,night:null,recN:0,busy:false,logs:[],modalOpen:false,
  speed:2.2,anim:true,follow:true,gen:0,paused:false,resume:[],turn:null,cap:'',curHero:null,
  flash:{},shake:{},live:false,cfg:null,tut:false,coached:{},prev:{},pops:{},pctx:'pause'};
try{const s=JSON.parse(localStorage.getItem('outlive.settings')||'null');if(s){if(typeof s.speed==='number')V.speed=s.speed;if(typeof s.anim==='boolean')V.anim=s.anim;if(typeof s.follow==='boolean')V.follow=s.follow}}catch(e){}
const saveSet=()=>{try{localStorage.setItem('outlive.settings',JSON.stringify({speed:V.speed,anim:V.anim,follow:V.follow}))}catch(e){}};

/* ---------- custom artwork: stays on this device (IndexedDB), never uploaded ---------- */
const ART={map:null,mapRatio:null,leaders:{},names:{}};
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('outlive-art',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function kvGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function kvSet(k,v){try{const d=await idb();await new Promise(r=>{const t=d.transaction('kv','readwrite');v==null?t.objectStore('kv').delete(k):t.objectStore('kv').put(v,k);t.oncomplete=()=>r();t.onerror=()=>r()})}catch(e){}}
function pickFile(){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>res(i.files&&i.files[0]||null);i.oncancel=()=>res(null);i.click()})}
async function shrink(file,max){
  const bm=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bm.width,bm.height));
  const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
  c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  return {blob:await new Promise(r=>c.toBlob(r,'image/jpeg',.88)),w:c.width,h:c.height};
}
async function loadArt(){
  const m=await kvGet('map');
  if(m&&m.blob){ART.map=URL.createObjectURL(m.blob);ART.mapRatio=m.w/m.h}
  for(const l of LEADERS){
    const b=await kvGet('leader:'+l.id);if(b)ART.leaders[l.id]=URL.createObjectURL(b);
    const n=await kvGet('name:'+l.id);if(n){ART.names[l.id]=n;l.n=n}
  }
}
async function setMap(file){
  const r=await shrink(file,1800);await kvSet('map',{blob:r.blob,w:r.w,h:r.h});
  if(ART.map)URL.revokeObjectURL(ART.map);ART.map=URL.createObjectURL(r.blob);ART.mapRatio=r.w/r.h;
}
async function clearMap(){await kvSet('map',null);if(ART.map)URL.revokeObjectURL(ART.map);ART.map=null;ART.mapRatio=null}
async function setLeaderImg(id,file){
  const r=await shrink(file,360);await kvSet('leader:'+id,r.blob);
  if(ART.leaders[id])URL.revokeObjectURL(ART.leaders[id]);ART.leaders[id]=URL.createObjectURL(r.blob);
}
async function clearLeaderImg(id){await kvSet('leader:'+id,null);if(ART.leaders[id])URL.revokeObjectURL(ART.leaders[id]);delete ART.leaders[id]}
const portrait=(id,cls)=>ART.leaders[id]?`<img class="${cls||'por'}" src="${ART.leaders[id]}" alt="">`:'';

/* ---------- timing (pause + abort aware) ---------- */
function wait(ms){
  const g=V.gen;
  return new Promise(res=>{
    setTimeout(async()=>{
      while(V.paused&&g===V.gen)await new Promise(r=>V.resume.push(r));
      if(g!==V.gen)return;           // game was abandoned: the old game never continues
      res();
    },Math.max(0,ms));
  });
}

/* ---------- modal system ---------- */
function openModal(build,opts){
  opts=opts||{};
  return new Promise(resolve=>{
    const root=$('#modal');
    root.innerHTML='';
    const box=document.createElement('div');box.className='mbox'+(opts.wide?' wide':'');
    root.appendChild(box);root.classList.add('on');V.modalOpen=true;sfx('open');
    const done=v=>{root.classList.remove('on');root.innerHTML='';V.modalOpen=false;renderTurn();resolve(v)};
    V._closeModal=()=>{root.classList.remove('on');root.innerHTML='';V.modalOpen=false};
    build(box,done);
    box.scrollTop=0;renderTurn();
  });
}
function btn(label,cls,fn,sub){
  const b=document.createElement('button');b.className='btn '+(cls||'');

function heroTok(p,hi){
  const h=p.heroes[hi];

    case'city':g=bld(6,12,34)+bld(20,10,48)+bld(32,14,28)+bld(48,10,52)+bld(60,14,36)+bld(76,10,44)+bld(88,9,26);break;

  for(let d=1;d<=6;d++){
